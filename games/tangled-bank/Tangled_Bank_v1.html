<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#152120">
<title>Tangled Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=IBM+Plex+Mono:wght@400;500&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap">
<style>
:root{
 --cab:#152120;--cab2:#1c2a28;--cab3:#253634;--paper:#e8dfc9;--paper-dim:rgba(232,223,201,.66);--ink:#29211b;--ink2:#5c4f44;
 --carmine:#a8263f;--ochre:#cf9a33;--teal:#46a19a;--slate:#8aa0b8;--line:rgba(232,223,201,.15);
 --fd:"Fraunces",Georgia,"Times New Roman",serif;--fb:"Spectral",Georgia,"Times New Roman",serif;--fm:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
 color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--cab:#152120;--cab2:#1c2a28;--paper:#e8dfc9}}
:root[data-theme="dark"]{--cab:#152120;--cab2:#1c2a28;--paper:#e8dfc9}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--cab);color:var(--paper);font:16px/1.5 var(--fb);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
#app{position:relative;height:100%;max-width:560px;margin:0 auto;overflow:hidden;background:var(--cab)}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
button{font:inherit;color:inherit;touch-action:manipulation}
.btn{font:600 15px/1.1 var(--fb);padding:11px 16px;min-height:44px;border-radius:6px;border:1.5px solid currentColor;background:transparent;cursor:pointer}
.btn.primary{background:var(--carmine);border-color:var(--carmine);color:#f7f0e2}
.btn.ghost{border-color:var(--line);color:var(--paper)}
.btn:disabled{opacity:.38;cursor:default}
.btn:focus-visible,.tip:focus-visible,.iconbtn:focus-visible,.tog:focus-visible,.seg button:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}
.mono{font-family:var(--fm);font-size:12px}
/* title */
#title-cv{position:absolute;inset:0;width:100%;height:100%}
.title-wrap{position:relative;margin-top:auto;padding:0 26px 30px}
.title-wrap h1{font:800 clamp(54px,17.5vw,86px)/.86 var(--fd);letter-spacing:-.03em;margin:0 0 16px}
.sub{font-size:18px;line-height:1.4;max-width:21em;margin:0 0 22px}
.quote{margin:24px 0 0;font-style:italic;color:var(--paper-dim);font-size:14px;line-height:1.4}
.quote span{font-style:normal;font-size:12px}
/* notebook */
.tree-head{padding:20px 20px 4px}
.tree-head h2{font:600 30px/1.05 var(--fd);margin:0;letter-spacing:-.01em}
.tree-head p{margin:6px 0 0;color:var(--paper-dim);font-size:14px}
.tree-body{position:relative;flex:1;overflow-y:auto;padding:0 14px 18px 0;-webkit-overflow-scrolling:touch}
#tree-svg{position:absolute;left:0;top:0;width:60px;pointer-events:none;overflow:visible}
#tree-rows{margin-left:60px}
.clade{font:italic 15px/1.2 var(--fb);color:var(--ochre);padding:18px 0 4px}
.tip{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:12px 4px;cursor:pointer;min-height:68px}
.tip .num{font:600 15px/1 var(--fd);color:var(--ochre);width:24px}
.tip .tt{flex:1;display:flex;flex-direction:column;gap:2px}
.tip b{font:600 19px/1.15 var(--fd)}
.tip i{font-size:14px;color:var(--paper-dim)}
.tip .st{color:var(--ochre);font-size:15px;letter-spacing:1px;white-space:nowrap}
.tip .st .off{opacity:.3}
.tree-foot{display:flex;gap:10px;justify-content:space-between;padding:10px 16px 12px;border-top:1px solid var(--line)}
/* play */
#bar{display:flex;align-items:center;gap:6px;height:48px;padding:0 10px 0 2px;border-bottom:1px solid var(--line);flex:0 0 auto}
.iconbtn{width:42px;height:42px;border:0;background:transparent;font:400 32px/1 var(--fd);color:var(--paper);cursor:pointer;display:grid;place-items:center;padding:0 0 4px}
#bar-title{flex:1;min-width:0;font:600 16px/1.1 var(--fd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar-title .n{color:var(--ochre);margin-right:7px}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex:0 0 auto}
.seg button{border:0;background:transparent;padding:0 8px;height:32px;min-width:32px;font:500 12px var(--fm);color:var(--paper-dim);cursor:pointer}
.seg button.on{background:var(--paper);color:var(--ink)}
#bar-gen{min-width:50px;text-align:right;color:var(--paper-dim);flex:0 0 auto}
#stage{position:relative;flex:1 1 auto;min-height:170px;overflow:hidden;background:#0f1716}
#scene{position:absolute;left:0;top:0;touch-action:none;display:block}
#panel{flex:0 0 auto;max-height:52%;overflow-y:auto;background:var(--cab2);border-top:1px solid var(--line);padding:10px 14px 12px;-webkit-overflow-scrolling:touch}
.hp .timer{height:6px;border-radius:3px;background:rgba(232,223,201,.12);overflow:hidden}
.hp .timer i{display:block;height:100%;width:100%;background:var(--ochre);transform-origin:left center}
.hp .row{display:flex;justify-content:space-between;align-items:baseline;margin:8px 0 6px;font-size:15px}
.hp .row b{font:600 21px var(--fd)}
.hp .obj-l{display:flex;justify-content:space-between;font-size:14px}
.hp .obj-l b{font-weight:600}
.hp .obj-s{font-size:13px;color:var(--paper-dim);margin-top:5px;line-height:1.35}
.meter{position:relative;height:10px;border-radius:5px;background:rgba(232,223,201,.1);margin:5px 0}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--teal);transition:width .4s}
.meter em{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--paper)}
.objs{list-style:none;margin:0 0 6px;padding:0}
.objs li{display:flex;gap:8px;font-size:14px;line-height:1.35;padding:3px 0}
.objs li .s{color:var(--paper-dim);flex:0 0 auto}
.objs li.got{color:var(--paper-dim)}
.objs li.got .s{color:var(--ochre)}
.levers{display:flex;flex-direction:column;gap:6px;margin:6px 0 8px}
.lrow{display:flex;align-items:center;gap:10px;font-size:14px;line-height:1.25}
.lrow label{flex:1}
.lrow output{font:500 12px var(--fm);min-width:36px;text-align:right}
.lrow .btn{flex:1;padding:9px 12px;min-height:40px;font-size:14px}
.tog{min-width:62px;height:34px;border-radius:17px;border:1px solid var(--line);background:transparent;color:var(--paper-dim);font:500 12px var(--fm);cursor:pointer}
.tog[aria-pressed="true"]{background:var(--carmine);border-color:var(--carmine);color:#f7f0e2}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1.3;height:30px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:rgba(232,223,201,.25)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--ochre);margin-top:-10px;border:2px solid var(--cab2)}
input[type=range]::-moz-range-track{height:4px;background:rgba(232,223,201,.25)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--ochre);border:0}
.tabs{display:flex;gap:6px;margin:6px 0 4px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:transparent;border-radius:15px;padding:4px 11px;font-size:13px;color:var(--paper-dim);cursor:pointer;min-height:32px}
.tabs button.on{border-color:var(--paper);color:var(--paper)}
.chart{width:100%;height:120px;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--paper-dim);margin-top:2px;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.read{font-size:13px;color:var(--paper-dim);margin-top:6px;line-height:1.45}
.read b{color:var(--paper);font-weight:600}
.price{margin:6px 0 2px}
.price .prow{display:grid;grid-template-columns:104px 1fr 50px;align-items:center;gap:8px;font-size:13px;margin:4px 0}
.price .pbar{position:relative;height:10px;background:rgba(232,223,201,.08);border-radius:5px}
.price .pbar::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--paper-dim)}
.price .pbar i{position:absolute;top:0;bottom:0;border-radius:4px}
.price .pv{font:500 11px var(--fm);text-align:right}
/* cards */
#cards{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(8,12,11,.62);z-index:20;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
#cards.on{display:flex}
.card{position:relative;width:min(100%,440px);max-height:100%;overflow-y:auto;background:var(--paper);color:var(--ink);border-radius:4px;padding:20px 18px 14px;box-shadow:0 18px 50px rgba(0,0,0,.5);-webkit-overflow-scrolling:touch}
.card::before{content:"";position:absolute;inset:6px;border:1px solid rgba(41,33,27,.22);border-radius:2px;pointer-events:none}
.card h3{font:600 25px/1.12 var(--fd);margin:0 0 4px;letter-spacing:-.01em}
.card h4{font:600 16px/1.2 var(--fd);margin:14px 0 4px}
.card p{margin:0 0 9px;font-size:15px;line-height:1.5}
.card .kicker{font-style:italic;color:var(--ink2);margin:0 0 12px}
.card .goal{border-left:3px solid var(--carmine);padding-left:10px}
.card .basis{font-size:14px;color:var(--ink2)}
.card .cap{font-size:13px;color:var(--ink2);font-style:italic;margin-top:-4px}
.card-btns{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px;position:relative}
.card .btn{color:var(--ink)}
.card .btn.primary{color:#f7f0e2}
.card canvas{width:100%;height:130px;display:block;margin:8px 0}
.card .stars{font-size:28px;color:var(--ochre);letter-spacing:4px;line-height:1.1}
.card .stars .off{color:rgba(41,33,27,.18)}
.card .leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin:-4px 0 6px}
.card .leg i{display:inline-block;width:12px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:5px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink2);margin-top:4px}
.chk input{width:20px;height:20px;accent-color:#a8263f}
#toasts{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 56px);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:30;pointer-events:none}
.toast{max-width:min(92%,420px);background:var(--paper);color:var(--ink);padding:9px 14px;border-radius:6px;font-size:14px;line-height:1.35;box-shadow:0 8px 24px rgba(0,0,0,.4);transition:opacity .5s,transform .5s}
.toast b{color:#8a5d10}
.toast.out{opacity:0;transform:translateY(-8px)}
#err{position:fixed;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);z-index:50;background:#3b0f16;color:#ffd9de;font:12px/1.4 var(--fm);padding:8px 10px;border-radius:6px;display:none;white-space:pre-wrap;max-height:40%;overflow:auto;-webkit-user-select:text;user-select:text}
@media (prefers-reduced-motion:reduce){.toast{transition:none}.meter i{transition:none}}
</style>
</head>
<body>
<div id="app">
 <section id="scr-title" class="screen on">
  <canvas id="title-cv"></canvas>
  <div class="title-wrap">
   <h1>Tangled<br>Bank</h1>
   <p class="sub">Six experiments in natural selection, in which you are the selection.</p>
   <button class="btn primary" id="btn-begin">Open the notebook</button>
   <p class="quote">“It is interesting to contemplate an entangled bank…”<br><span>Charles Darwin, 1859</span></p>
  </div>
 </section>
 <section id="scr-tree" class="screen">
  <header class="tree-head"><h2>Field notebook</h2><p id="tree-stars"></p></header>
  <div class="tree-body" id="tree-body"><svg id="tree-svg" xmlns="http://www.w3.org/2000/svg"></svg><div id="tree-rows"></div></div>
  <footer class="tree-foot"><button class="btn ghost" id="btn-title">Title</button><button class="btn ghost" id="btn-snd" aria-pressed="true">Sound on</button></footer>
 </section>
 <section id="scr-play" class="screen">
  <header id="bar">
   <button id="bar-back" class="iconbtn" aria-label="Back to the notebook">‹</button>
   <div id="bar-title"></div>
   <div id="speed" class="seg" role="group" aria-label="Speed"><button data-s="0" aria-label="Pause">❚❚</button><button data-s="1">1×</button><button data-s="2">4×</button><button data-s="3">16×</button></div>
   <div id="bar-gen" class="mono"></div>
  </header>
  <div id="stage"><canvas id="scene"></canvas></div>
  <div id="panel"></div>
 </section>
</div>
<div id="cards"></div>
<div id="toasts"></div>
<div id="err"></div>
<script>
(function(){
'use strict';
/* ================= CORE ================= */
const TAU = Math.PI * 2;
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
let _s = 1;
function seed(n) { _s = (n >>> 0) || 1; }
function R() { _s |= 0; _s = _s + 0x6D2B79F5 | 0; let t = Math.imul(_s ^ _s >>> 15, 1 | _s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
seed((Date.now() ^ (Math.random() * 1e9)) >>> 0);
function rng(sv) { let s = (sv >>> 0) || 1; return function () { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function gauss() { let u = 0; while (u === 0) u = R(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * R()); }
function poisson(l) { if (l <= 0) return 0; if (l > 30) return Math.max(0, Math.round(l + Math.sqrt(l) * gauss())); const L = Math.exp(-l); let k = 0, p = 1; do { k++; p *= R(); } while (p > L); return k - 1; }
function pick(a) { return a[(R() * a.length) | 0]; }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = (R() * (i + 1)) | 0; const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function mean(a) { if (!a.length) return 0; let s = 0; for (const x of a) s += x; return s / a.length; }
function wpick(w) { let t = 0; for (const x of w) t += x; let r = R() * t; for (let i = 0; i < w.length; i++) { r -= w[i]; if (r <= 0) return i; } return w.length - 1; }
const pct = x => Math.round(x * 100) + '%';
const f2 = x => (x >= 0 ? '+' : '−') + Math.abs(x).toFixed(2);
const $ = id => document.getElementById(id);

/* ---------- genetics: diploid, additive, free recombination ----------
   trait spec: {k, n (loci), m0, s0 (initial genetic mean/sd), mu (per-locus mutation prob), msd (effect sd), ve (environmental sd)}
   kind 'dom': one biallelic locus, allele 1 dominant. kind 'count': loci hold counts of deleterious mutations. */
const Gen = {
  layout(specs) { let o = 0; const T = {}; for (const s of specs) { s.off = o; o += s.n; T[s.k] = s; } return { specs, T, L: o }; },
  genome(lay, over) {
    const L = lay.L, g = new Float32Array(L * 2);
    for (const s of lay.specs) {
      const o = (over && over[s.k]) || {};
      for (let i = 0; i < s.n; i++) {
        const j = s.off + i;
        if (s.kind === 'dom') { const p = o.p != null ? o.p : s.p0; g[j] = R() < p ? 1 : 0; g[L + j] = R() < p ? 1 : 0; }
        else if (s.kind === 'count') { const c = s.c0f ? s.c0f(i) : (s.c0 || 0); g[j] = Math.min(s.cap || 99, poisson(c)); g[L + j] = Math.min(s.cap || 99, poisson(c)); }
        else { const m = o.m != null ? o.m : s.m0, sd = o.s != null ? o.s : s.s0, n2 = s.n * 2; g[j] = m / n2 + sd / Math.sqrt(n2) * gauss(); g[L + j] = m / n2 + sd / Math.sqrt(n2) * gauss(); }
      }
    }
    return g;
  },
  mate(lay, a, b) { const L = lay.L, c = new Float32Array(L * 2); this._gam(lay, a, c, 0); this._gam(lay, b, c, L); return c; },
  _gam(lay, g, out, off) {
    const L = lay.L;
    for (const s of lay.specs) {
      for (let i = 0; i < s.n; i++) {
        const j = s.off + i; let a = R() < 0.5 ? g[j] : g[L + j];
        if (s.kind === 'dom') { if (a < 0.5) { if (R() < s.mu) a = 1; } else if (s.back && R() < s.back) a = 0; }
        else if (s.kind === 'count') { a = Math.min(s.cap || 99, a + poisson(s.u)); }
        else if (R() < s.mu) a += s.msd * gauss();
        out[off + j] = a;
      }
    }
  },
  add(lay, g, k) { const s = lay.T[k], L = lay.L; let v = 0; for (let i = 0; i < s.n; i++) v += g[s.off + i] + g[L + s.off + i]; return v; },
  ph(lay, g, k) { const s = lay.T[k]; return clamp(this.add(lay, g, k) + (s.ve || 0) * gauss(), s.lo != null ? s.lo : 0, s.hi != null ? s.hi : 1); },
  dom(lay, g, k) { const s = lay.T[k]; return g[s.off] > 0.5 || g[lay.L + s.off] > 0.5; },
  cnt(lay, g, k, i) { const s = lay.T[k]; return g[s.off + i] + g[lay.L + s.off + i]; },
  freq(lay, pop, k) { const s = lay.T[k]; let c = 0; for (const x of pop) c += x.g[s.off] + x.g[lay.L + s.off]; return pop.length ? c / (2 * pop.length) : 0; }
};

/* ---------- colour ---------- */
function hsl2rgb(h, s, l) { h = (((h % 360) + 360) % 360) / 360; const q = l < .5 ? l * (1 + s) : l + s - l * s, p = 2 * l - q; const f = t => { if (t < 0) t += 1; if (t > 1) t -= 1; return t < 1 / 6 ? p + (q - p) * 6 * t : t < .5 ? q : t < 2 / 3 ? p + (q - p) * (2 / 3 - t) * 6 : p; }; return [f(h + 1 / 3) * 255, f(h) * 255, f(h - 1 / 3) * 255]; }
const css = (c, a) => a == null ? 'rgb(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ')' : 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + a + ')';
const mix = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; }

/* ---------- value noise ---------- */
function makeNoise(sv) {
  const r = rng(sv), P = new Uint8Array(512), p = []; for (let i = 0; i < 256; i++) p.push(i);
  for (let i = 255; i > 0; i--) { const j = (r() * (i + 1)) | 0; const t = p[i]; p[i] = p[j]; p[j] = t; }
  for (let i = 0; i < 512; i++) P[i] = p[i & 255];
  const V = new Float32Array(256); for (let i = 0; i < 256; i++) V[i] = r();
  return function (x, y) {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, X = xi & 255, Y = yi & 255;
    const a = V[P[P[X] + Y]], b = V[P[P[X + 1] + Y]], c = V[P[P[X] + Y + 1]], d = V[P[P[X + 1] + Y + 1]];
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  };
}
function fbm(n, x, y, o) { let s = 0, a = 0.5, f = 1, t = 0; for (let i = 0; i < o; i++) { s += a * n(x * f, y * f); t += a; a *= 0.5; f *= 2.03; } return s / t; }

/* ---------- sound (WebAudio, synthesised) ---------- */
const Snd = {
  ctx: null, on: true,
  init() { if (this.ctx) return; try { const A = window.AudioContext || window.webkitAudioContext; if (A) this.ctx = new A(); } catch (e) { this.ctx = null; } },

const Steward = {
  sync: false, speeds: [0, 1, 4, 16],
  start(ch) {
    this.ch = ch; this.S = ch.init(); this.S.gen = 0; this.S.anim = 0; this.acc = 0; this.got = {}; this.done = false; this.free = false; this.tab = 0; this.lastRef = 0; this.dirty = true;
    this.panel(); ch.sync(this.S); this.setSpeed(1); this.refresh();
  },
  setSpeed(i) { this.speed = i; document.querySelectorAll('#speed button').forEach(b => b.classList.toggle('on', +b.dataset.s === i)); },
  update(dt) {
    const ch = this.ch, S = this.S;
    if (this.speed > 0 && !this.done) {
      this.acc += dt * this.speeds[this.speed]; let n = 0;
      while (this.acc >= ch.period && n < 30) { this.acc -= ch.period; this.step(); n++; if (this.done) break; }
      if (n >= 30) this.acc = 0;
    }
    S.anim += dt; ch.animate(S, dt, this.speed);
  },
  step() { const ch = this.ch, S = this.S; ch.step(S); S.gen++; ch.record(S); ch.sync(S); this.check(); this.dirty = true; },
  check() {
    const S = this.S;
    for (const o of this.ch.objectives) {
      if (!this.got[o.id] && o.test(S)) {
        this.got[o.id] = S.gen; Save.star(this.ch.id, Object.keys(this.got).length);
        if (!this.sync) { Snd.star(); toast('<b>★</b> ' + o.short); this.markObjs(); }
      }
    }
    const n = Object.keys(this.got).length;
    if (!this.free && (n === this.ch.objectives.length || S.gen >= this.ch.maxGen)) this.finish();
  },
  finish() {
    this.done = true; this.setSpeed(0); if (this.sync) return;
    const ch = this.ch, n = Object.keys(this.got).length; if (n) Snd.star(); else Snd.chime();
    this.refresh();
    const next = CHAPTERS[CHAPTERS.indexOf(ch) + 1];
    const btns = [{ t: 'Keep experimenting', fn: () => { Cards.close(); this.done = false; this.free = true; this.setSpeed(1); } }, { t: 'Notebook', fn: () => App.exit() }];
    if (next) btns.push({ t: 'Next: ' + next.title, primary: true, fn: () => { Cards.close(); App.open(next); } });
    else btns.push({ t: 'Play again', primary: true, fn: () => { Cards.close(); App.play(ch); } });
    Cards.open({
      cls: 'end',
      html: '<h3>' + (n === ch.objectives.length ? 'Chapter complete' : 'Time is up') + '</h3><div class="stars">' + starStr(n) + '</div>' + (ch.tabs[0].legendP || '') + '<canvas></canvas><p class="cap">' + ch.chartCap + '</p><h4>What happened</h4><p>' + ch.what(this.S) + '</p><h4>The real thing</h4><p class="basis">' + ch.intro.real + '</p>',
      buttons: btns, onOpen: box => ch.tabs[0].draw(box.querySelector('canvas'), this.S, 'paper')
    });
  },
  draw() { this.ch.draw(Stage.ctx, this.S, Stage.w, Stage.h); const now = performance.now(); if (this.dirty && now - this.lastRef > 160) this.refresh(); },
  refresh() {

    const cv = $('s-chart'); if (cv) this.ch.tabs[this.tab].draw(cv, this.S, 'dark');

    $('panel').innerHTML = h; ch.bind(this.S);

  },

function drawGuppy(c, x, y, hd, f, s) {
  c.save(); c.translate(x, y); c.rotate(hd); c.scale(s, s);
  if (f.sex === 'm') {
    const C = f.col;
    c.fillStyle = css(mix([168, 174, 166], [240, 116, 44], C), 0.92); c.beginPath(); c.moveTo(-3.4, 0); c.lineTo(-9, -3.4 - C * 1.4); c.lineTo(-9, 3.4 + C * 1.4); c.closePath(); c.fill();
    c.fillStyle = '#c3c8ba'; c.beginPath(); c.ellipse(0, 0, 4.4, 1.7, 0, 0, TAU); c.fill();
    const n = Math.round(C * 6), cols = ['#f07a2c', '#1c1a1a', '#4aa6e6'];
    for (let i = 0; i < n; i++) { c.fillStyle = cols[i % 3]; c.beginPath(); c.arc(2 - i * 1.05, i % 2 ? 0.55 : -0.55, 0.55 + C * 0.45, 0, TAU); c.fill(); }
  } else {
    c.fillStyle = 'rgba(160,164,140,.8)'; c.beginPath(); c.moveTo(-4.4, 0); c.lineTo(-8.2, -2.2); c.lineTo(-8.2, 2.2); c.closePath(); c.fill();
    c.fillStyle = '#8f9477'; c.beginPath(); c.ellipse(0, 0, 5.4, 2.2, 0, 0, TAU); c.fill();
    c.fillStyle = 'rgba(40,36,30,.55)'; c.beginPath(); c.ellipse(-1, 0.6, 1.2, 0.8, 0, 0, TAU); c.fill();
  }
  c.fillStyle = '#111'; c.beginPath(); c.arc(f.sex === 'm' ? 3.3 : 4.2, -0.4, 0.45, 0, TAU); c.fill();

}
function drawCichlid(c, x, y, hd, s) {
  c.save(); c.translate(x, y); c.rotate(hd); c.scale(s, s);
  c.fillStyle = '#34402b'; c.beginPath(); c.moveTo(-10, 0); c.lineTo(-16, -4.5); c.lineTo(-16, 4.5); c.closePath(); c.fill();
  c.fillStyle = '#46553a'; c.beginPath(); c.ellipse(0, 0, 12, 3.6, 0, 0, TAU); c.fill();
  c.strokeStyle = 'rgba(20,24,16,.6)'; c.lineWidth = 1; for (let i = -6; i <= 6; i += 4) { c.beginPath(); c.moveTo(i, -3); c.lineTo(i - 1, 3); c.stroke(); }
  c.fillStyle = '#d8c060'; c.beginPath(); c.arc(8.5, -1, 1.2, 0, TAU); c.fill(); c.fillStyle = '#111'; c.beginPath(); c.arc(8.7, -1, 0.6, 0, TAU); c.fill();
  c.restore();
}
function wander(a, dt, sp, lim) {
  a.h += (R() - .5) * dt * 4; a.u += Math.cos(a.h) * sp * dt; a.v += Math.sin(a.h) * sp * dt;
  if (a.u * a.u + a.v * a.v > lim) { a.h = Math.atan2(-a.v, -a.u) + (R() - .5) * 0.9; const k = Math.sqrt(lim / (a.u * a.u + a.v * a.v)); a.u *= k; a.v *= k; }
}

const CH_ARIPO = {

  unit: g => 'gen ' + g,

  mk(S, g, sex, mom) { const f = { g, sex, col: Gen.ph(S.lay, g, 'col'), pref: Gen.ph(S.lay, g, 'pref') }; if (mom && mom.a) f.a = { u: clamp(mom.a.u + (R() - .5) * .3, -.9, .9), v: clamp(mom.a.v + (R() - .5) * .3, -.9, .9), h: R() * TAU }; return f; },
  step(S) {

      shuffle(kids); P.fish = kids.slice(0, this.K[j]).map(([g, mom]) => this.mk(S, g, R() < 0.5 ? 'm' : 'f', mom));

CH_BITTER.intro.basis = 'Henry Walter Bates’s Amazonian butterflies (1862).';
const CHAPTERS = [CH_LICHEN, CH_SOOT, CH_BITTER, CH_ARIPO, CH_ISLAND, CH_COMMONS];
const CLADES = [{ name: 'You are the predator', tree: [[0, 1], 2] }, { name: 'You are the environment', tree: [[3, 4], 5] }];

function introHTML(ch) {
  const i = ch.intro;
  return '<h3>' + ch.title + '</h3><p class="kicker">Chapter ' + ch.num + '. ' + ch.concept + '</p><p>' + i.premise + '</p><p><b>Your part.</b> ' + i.part + '</p><p class="goal"><b>Goal.</b> ' + i.goal + '</p><p class="basis">Based on ' + i.basis + '</p>';
}

const App = {
  scr: 'title', mode: null, ch: null,
  go(scr) {
    document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === 'scr-' + scr)); this.scr = scr;
    if (scr === 'tree') Tree.render();
    if (scr === 'play') Stage.resize();
  },
  open(ch) { Cards.open({ cls: 'intro', html: introHTML(ch), buttons: [{ t: 'Back', fn: () => Cards.close() }, { t: 'Begin', primary: true, fn: () => { Cards.close(); this.play(ch); } }] }); },
  play(ch) {
    this.ch = ch; this.mode = null; this.go('play');
    $('bar-title').innerHTML = '<span class="n">' + ch.num + '</span>' + ch.title;
    $('speed').style.display = ch.mode === 'hunt' ? 'none' : 'flex';
    Stage.resize();
    this.mode = ch.mode === 'hunt' ? Hunt : Steward; this.mode.start(ch); Stage.resize(); setTimeout(() => Stage.resize(), 60);
  },
  exit() { if (this.mode === Hunt) Hunt.state = 'idle'; this.mode = null; Cards.close(); this.go('tree'); }
};

const Tree = {
  render() {
    const rows = $('tree-rows'); let h = '', tot = 0;
    for (const cl of CLADES) {
      h += '<div class="clade">' + cl.name + '</div>';
      for (const i of cl.tree.flat()) { const ch = CHAPTERS[i], st = Save.d.stars[ch.id] || 0; tot += st; h += '<button class="tip" data-i="' + i + '"><span class="num">' + ch.num + '</span><span class="tt"><b>' + ch.title + '</b><i>' + ch.concept + '</i></span><span class="st" aria-label="' + st + ' of 3 stars">' + '★'.repeat(st) + '<span class="off">' + '★'.repeat(3 - st) + '</span></span></button>'; }
    }
    rows.innerHTML = h;
    $('tree-stars').textContent = tot ? tot + ' of 18 stars earned. Any chapter, any order.' : 'Six chapters. Start anywhere; the first is the gentlest.';
    rows.querySelectorAll('.tip').forEach(b => b.onclick = () => { Snd.init(); Snd.resume(); Snd.click(); App.open(CHAPTERS[+b.dataset.i]); });
    setTimeout(() => this.svg(), 30);
  },
  svg() {
    const svg = $('tree-svg'), rows = $('tree-rows'); if (!svg || !rows.offsetHeight) return;
    const y = {}; rows.querySelectorAll('.tip').forEach(b => { y[+b.dataset.i] = b.offsetTop + b.offsetHeight / 2; });
    const H = rows.offsetTop + rows.offsetHeight; svg.setAttribute('height', H); svg.style.height = H + 'px';
    const TX = 54, PX = 40, CX = 26, RX = 10; let p = '';
    const line = (x1, y1, x2, y2) => { p += 'M' + x1 + ' ' + y1.toFixed(1) + 'L' + x2 + ' ' + y2.toFixed(1); };
    const cy = CLADES.map(cl => {
      const [[a, b], c] = cl.tree;
      line(PX, y[a], TX, y[a]); line(PX, y[b], TX, y[b]); line(PX, y[a], PX, y[b]); const py = (y[a] + y[b]) / 2;
      line(CX, py, PX, py); line(CX, y[c], TX, y[c]); line(CX, py, CX, y[c]); const v = (py + y[c]) / 2;
      line(RX, v, CX, v); return v;
    });
    line(RX, cy[0], RX, cy[1]); line(2, (cy[0] + cy[1]) / 2, RX, (cy[0] + cy[1]) / 2);
    let dots = '';
    for (const i in y) { const st = Save.d.stars[CHAPTERS[i].id] || 0; dots += '<circle cx="' + TX + '" cy="' + y[i].toFixed(1) + '" r="4" fill="' + (st ? '#cf9a33' : '#152120') + '" stroke="' + (st ? '#cf9a33' : 'rgba(232,223,201,.6)') + '" stroke-width="1.5"/>'; }
    svg.innerHTML = '<path d="' + p + '" fill="none" stroke="rgba(232,223,201,.5)" stroke-width="1.5" stroke-linecap="round"/>' + dots;
  }
};

const Title = {
  segs: null, t: 0, key: '',
  build(w, h) {
    const r = rng(1859), segs = [];
    const grow = (x, y, a, len, depth, t0) => {
      const x2 = x + Math.cos(a) * len, y2 = y + Math.sin(a) * len, t1 = t0 + 0.18 + len / 420;
      const tip = depth >= 8 || y2 < h * 0.04 || (depth > 3 && r() < 0.1);
      segs.push({ x, y, x2, y2, t0, t1, w: Math.max(0.7, 2.8 - depth * 0.3), tip, dead: tip && r() < 0.3 });
      if (tip) return;
      grow(x2, y2, a - (0.2 + r() * 0.4), len * (0.72 + r() * 0.16), depth + 1, t1);
      grow(x2, y2, a + (0.2 + r() * 0.4), len * (0.72 + r() * 0.16), depth + 1, t1);
    };
    grow(w * 0.7, h * 0.6, -Math.PI / 2 - 0.12, h * 0.11, 0, 0.15);
    this.segs = segs; this.key = w + 'x' + h; this.end = Math.max(...segs.map(s => s.t1)) + 0.2;
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) this.t = this.end;
  },
  tick(dt) {
    const cv = $('title-cv'); if (!cv) return; const { c, w, h } = fitCanvas(cv);
    if (this.key !== w + 'x' + h) { this.build(w, h); }
    if (this.drawn && this.t > this.end) return;
    this.t += dt; c.clearRect(0, 0, w, h); c.lineCap = 'round';
    for (const s of this.segs) {
      if (this.t < s.t0) continue; const k = clamp((this.t - s.t0) / (s.t1 - s.t0), 0, 1);
      c.strokeStyle = 'rgba(232,223,201,' + (0.28 + 0.3 * (s.w / 2.8)) + ')'; c.lineWidth = s.w;
      c.beginPath(); c.moveTo(s.x, s.y); c.lineTo(lerp(s.x, s.x2, k), lerp(s.y, s.y2, k)); c.stroke();
      if (s.tip && k >= 1) { if (s.dead) { c.strokeStyle = 'rgba(232,223,201,.45)'; c.lineWidth = 1; c.beginPath(); c.moveTo(s.x2 - 3, s.y2); c.lineTo(s.x2 + 3, s.y2); c.stroke(); } else { c.fillStyle = '#cf9a33'; c.beginPath(); c.arc(s.x2, s.y2, 2.2, 0, TAU); c.fill(); } }
    }
    if (this.t > this.end) this.drawn = true;
  }
};

function showErr(e) { const el = $('err'); el.style.display = 'block'; el.textContent = 'Something broke: ' + (e && (e.stack || e.message) || e) + '\n(Tap to dismiss.)'; el.onclick = () => el.style.display = 'none'; }
window.addEventListener('error', e => showErr(e.error || e.message));

let lastT = performance.now();
function frame() {
  const now = performance.now(), dt = Math.min(0.05, Math.max(0, (now - lastT) / 1000)); lastT = now;
  try {
    if (App.scr === 'title') Title.tick(dt);
    else if (App.scr === 'play' && App.mode) { Stage.ctx.setTransform(Stage.dpr, 0, 0, Stage.dpr, 0, 0); App.mode.update(dt); if (App.mode) App.mode.draw(); }
  } catch (e) { showErr(e); App.mode = null; }
  setTimeout(frame, 16);
}

function boot() {
  Save.load(); Snd.on = Save.d.snd !== false;
  Stage.init();
  $('btn-begin').onclick = () => { Snd.init(); Snd.resume(); Snd.click(); App.go('tree'); };
  $('btn-title').onclick = () => { Title.t = 0; Title.drawn = false; App.go('title'); };
  const sb = $('btn-snd'); const sl = () => { sb.textContent = Snd.on ? 'Sound on' : 'Sound off'; sb.setAttribute('aria-pressed', Snd.on ? 'true' : 'false'); }; sl();
  sb.onclick = () => { Snd.on = !Snd.on; Save.d.snd = Snd.on; Save.save(); sl(); Snd.init(); Snd.click(); };
  $('bar-back').onclick = () => App.exit();
  document.querySelectorAll('#speed button').forEach(b => b.onclick = () => { Snd.click(); if (App.mode === Steward) Steward.setSpeed(+b.dataset.s); });
  window.addEventListener('resize', () => { if (App.scr === 'tree') Tree.svg(); });
  // content validation on boot: every chapter must be complete
  for (const ch of CHAPTERS) { for (const k of ['id', 'mode', 'num', 'title', 'concept', 'intro']) if (!ch[k]) throw new Error('Chapter missing ' + k + ': ' + ch.title); for (const k of ['premise', 'part', 'goal', 'basis', 'real']) if (!ch.intro[k]) throw new Error('Chapter ' + ch.id + ' intro missing ' + k); }
  App.go('title'); frame();
}
window.TB = { App, Hunt, Steward, CHAPTERS, Gen, seed, R, Save, Stage, Cards };
boot();

})();

</script>
