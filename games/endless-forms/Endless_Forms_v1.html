<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#152120">
<title>Endless Forms</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=IBM+Plex+Mono:wght@400;500&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap">
<style>
:root{
 --cab:#152120;--cab2:#1c2a28;--cab3:#253634;--paper:#e8dfc9;--paper-dim:rgba(232,223,201,.66);--ink:#29211b;--ink2:#5c4f44;
 --carmine:#a8263f;--ochre:#cf9a33;--teal:#46a19a;--slate:#8aa0b8;--line:rgba(232,223,201,.15);
 --fd:"Fraunces",Georgia,"Times New Roman",serif;--fb:"Spectral",Georgia,"Times New Roman",serif;--fm:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
 color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--cab:#152120;--cab2:#1c2a28;--paper:#e8dfc9}}
:root[data-theme="dark"]{--cab:#152120;--cab2:#1c2a28;--paper:#e8dfc9}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--cab);color:var(--paper);font:16px/1.5 var(--fb);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
#app{position:relative;height:100%;max-width:560px;margin:0 auto;overflow:hidden;background:var(--cab)}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
button{font:inherit;color:inherit;touch-action:manipulation}
.btn{font:600 15px/1.1 var(--fb);padding:11px 16px;min-height:44px;border-radius:6px;border:1.5px solid currentColor;background:transparent;cursor:pointer}
.btn.primary{background:var(--carmine);border-color:var(--carmine);color:#f7f0e2}
.btn.ghost{border-color:var(--line);color:var(--paper)}
.btn:disabled{opacity:.38;cursor:default}
.btn:focus-visible,.tip:focus-visible,.iconbtn:focus-visible,.tog:focus-visible,.seg button:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}
.mono{font-family:var(--fm);font-size:12px}
/* title */
#title-cv{position:absolute;inset:0;width:100%;height:100%}
.title-wrap{position:relative;margin-top:auto;padding:0 26px 30px}
.title-wrap h1{font:800 clamp(54px,17.5vw,86px)/.86 var(--fd);letter-spacing:-.03em;margin:0 0 16px}
.sub{font-size:18px;line-height:1.4;max-width:21em;margin:0 0 22px}
.quote{margin:24px 0 0;font-style:italic;color:var(--paper-dim);font-size:14px;line-height:1.4}
.quote span{font-style:normal;font-size:12px}
/* notebook */
.tree-head{padding:20px 20px 4px}
.tree-head h2{font:600 30px/1.05 var(--fd);margin:0;letter-spacing:-.01em}
.tree-head p{margin:6px 0 0;color:var(--paper-dim);font-size:14px}
.tree-body{position:relative;flex:1;overflow-y:auto;padding:0 14px 18px 0;-webkit-overflow-scrolling:touch}
#tree-svg{position:absolute;left:0;top:0;width:60px;pointer-events:none;overflow:visible}
#tree-rows{margin-left:60px}
.clade{font:italic 15px/1.2 var(--fb);color:var(--ochre);padding:18px 0 4px}
.tip{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:12px 4px;cursor:pointer;min-height:68px}
.tip .num{font:600 15px/1 var(--fd);color:var(--ochre);width:24px}
.tip .tt{flex:1;display:flex;flex-direction:column;gap:2px}
.tip b{font:600 19px/1.15 var(--fd)}
.tip i{font-size:14px;color:var(--paper-dim)}
.tip .st{color:var(--ochre);font-size:15px;letter-spacing:1px;white-space:nowrap}
.tip .st .off{opacity:.3}
.tree-foot{display:flex;gap:10px;justify-content:space-between;padding:10px 16px 12px;border-top:1px solid var(--line)}
/* play */
#bar{display:flex;align-items:center;gap:6px;height:48px;padding:0 10px 0 2px;border-bottom:1px solid var(--line);flex:0 0 auto}
.iconbtn{width:42px;height:42px;border:0;background:transparent;font:400 32px/1 var(--fd);color:var(--paper);cursor:pointer;display:grid;place-items:center;padding:0 0 4px}
#bar-title{flex:1;min-width:0;font:600 16px/1.1 var(--fd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar-title .n{color:var(--ochre);margin-right:7px}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex:0 0 auto}
.seg button{border:0;background:transparent;padding:0 8px;height:32px;min-width:32px;font:500 12px var(--fm);color:var(--paper-dim);cursor:pointer}
.seg button.on{background:var(--paper);color:var(--ink)}
#bar-gen{min-width:50px;text-align:right;color:var(--paper-dim);flex:0 0 auto}
#stage{position:relative;flex:1 1 auto;min-height:170px;overflow:hidden;background:#0f1716}
#scene{position:absolute;left:0;top:0;touch-action:none;display:block}
#panel{flex:0 0 auto;max-height:52%;overflow-y:auto;background:var(--cab2);border-top:1px solid var(--line);padding:10px 14px 12px;-webkit-overflow-scrolling:touch}
.hp .timer{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.hp .timer i{display:block;height:100%;width:100%;background:var(--ochre);transform-origin:left center}
.hp .row{display:flex;justify-content:space-between;align-items:baseline;margin:8px 0 6px;font-size:15px}
.hp .row b{font:600 21px var(--fd)}
.hp .obj-l{display:flex;justify-content:space-between;font-size:14px}
.hp .obj-l b{font-weight:600}
.hp .obj-s{font-size:13px;color:var(--paper-dim);margin-top:5px;line-height:1.35}
.meter{position:relative;height:10px;border-radius:5px;background:var(--line);margin:5px 0}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--teal);transition:width .4s}
.meter em{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--paper)}
.objs{list-style:none;margin:0 0 6px;padding:0}
.objs li{display:flex;gap:8px;font-size:14px;line-height:1.35;padding:3px 0}
.objs li .s{color:var(--paper-dim);flex:0 0 auto}
.objs li.got{color:var(--paper-dim)}
.objs li.got .s{color:var(--ochre)}
.levers{display:flex;flex-direction:column;gap:6px;margin:6px 0 8px}
.lrow{display:flex;align-items:center;gap:10px;font-size:14px;line-height:1.25}
.lrow label{flex:1}
.lrow output{font:500 12px var(--fm);min-width:36px;text-align:right}
.lrow .btn{flex:1;padding:9px 12px;min-height:40px;font-size:14px}
.tog{min-width:62px;height:34px;border-radius:17px;border:1px solid var(--line);background:transparent;color:var(--paper-dim);font:500 12px var(--fm);cursor:pointer}
.tog[aria-pressed="true"]{background:var(--carmine);border-color:var(--carmine);color:#f7f0e2}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1.3;height:30px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--ochre);margin-top:-10px;border:2px solid var(--cab2)}
input[type=range]::-moz-range-track{height:4px;background:rgba(232,223,201,.25)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--ochre);border:0}
.tabs{display:flex;gap:6px;margin:6px 0 4px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:transparent;border-radius:15px;padding:4px 11px;font-size:13px;color:var(--paper-dim);cursor:pointer;min-height:32px}
.tabs button.on{border-color:var(--paper);color:var(--paper)}
.chart{width:100%;height:120px;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--paper-dim);margin-top:2px;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.read{font-size:13px;color:var(--paper-dim);margin-top:6px;line-height:1.45}
.read b{color:var(--paper);font-weight:600}
.price{margin:6px 0 2px}
.price .prow{display:grid;grid-template-columns:104px 1fr 50px;align-items:center;gap:8px;font-size:13px;margin:4px 0}
.price .pbar{position:relative;height:10px;background:rgba(232,223,201,.08);border-radius:5px}
.price .pbar::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--paper-dim)}
.price .pbar i{position:absolute;top:0;bottom:0;border-radius:4px}
.price .pv{font:500 11px var(--fm);text-align:right}
/* cards */
#cards{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(8,12,11,.62);z-index:20;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
#cards.on{display:flex}
.card{position:relative;width:min(100%,440px);max-height:100%;overflow-y:auto;background:var(--paper);color:var(--ink);border-radius:4px;padding:20px 18px 14px;box-shadow:0 18px 50px rgba(0,0,0,.5);-webkit-overflow-scrolling:touch}
.card::before{content:"";position:absolute;inset:6px;border:1px solid rgba(41,33,27,.22);border-radius:2px;pointer-events:none}
.card h3{font:600 25px/1.12 var(--fd);margin:0 0 4px;letter-spacing:-.01em}
.card h4{font:600 16px/1.2 var(--fd);margin:14px 0 4px}
.card p{margin:0 0 9px;font-size:15px;line-height:1.5}
.card .kicker{font-style:italic;color:var(--ink2);margin:0 0 12px}
.card .goal{border-left:3px solid var(--carmine);padding-left:10px}
.card .basis{font-size:14px;color:var(--ink2)}
.card .cap{font-size:13px;color:var(--ink2);font-style:italic;margin-top:-4px}
.card-btns{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px;position:relative}
.card .btn{color:var(--ink)}
.card .btn.primary{color:#f7f0e2}
.card canvas{width:100%;height:130px;display:block;margin:8px 0}
.card .stars{font-size:28px;color:var(--ochre);letter-spacing:4px;line-height:1.1}
.card .stars .off{color:rgba(41,33,27,.18)}
.card .leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin:-4px 0 6px}
.card .leg i{display:inline-block;width:12px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:5px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink2);margin-top:4px}
.chk input{width:20px;height:20px;accent-color:#a8263f}
#toasts{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 56px);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:30;pointer-events:none}
.toast{max-width:min(92%,420px);background:var(--paper);color:var(--ink);padding:9px 14px;border-radius:6px;font-size:14px;line-height:1.35;box-shadow:0 8px 24px rgba(0,0,0,.4);transition:opacity .5s,transform .5s}
.toast b{color:#8a5d10}
.toast.out{opacity:0;transform:translateY(-8px)}
#err{position:fixed;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);z-index:50;background:#3b0f16;color:#ffd9de;font:12px/1.4 var(--fm);padding:8px 10px;border-radius:6px;display:none;white-space:pre-wrap;max-height:40%;overflow:auto;-webkit-user-select:text;user-select:text}
@media (prefers-reduced-motion:reduce){.toast{transition:none}.meter i{transition:none}}

/* ===== Endless Forms additions ===== */
#scr-play{background:var(--cab);color:var(--paper)}
#scr-play .btn:not(.primary){color:var(--paper)}
#scr-play .btn.sel{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.slider-row{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:14px}
.slider-row input{flex:1}
.menu-head{padding:20px 20px 6px}
.menu-head h2{font:600 30px/1.05 var(--fd);margin:0;letter-spacing:-.01em}
.menu-head p{margin:6px 0 0;color:var(--paper-dim);font-size:14px}
.menu-body{flex:1;overflow-y:auto;padding:0 14px 20px 14px;-webkit-overflow-scrolling:touch}
.part{margin:14px 0 2px;padding-left:22px;position:relative}
.part h3{font:italic 400 15px/1.2 var(--fb);color:var(--ochre);margin:0 0 2px}
.part h3 span{font-style:normal;font-family:var(--fd);margin-right:6px}
.chap{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:11px 4px 11px 22px;cursor:pointer;min-height:60px;position:relative}
.chap::before{content:"";position:absolute;left:5px;top:0;bottom:0;width:1.5px;background:rgba(232,223,201,.28)}
.chap::after{content:"";position:absolute;left:1px;top:50%;width:9px;height:9px;margin-top:-5px;border-radius:50%;background:var(--cab);border:1.5px solid rgba(232,223,201,.6)}
.chap.won::after{background:var(--ochre);border-color:var(--ochre)}
.chap .no{font:600 14px/1 var(--fd);color:var(--ochre);width:22px;text-align:right}
.chap .tt{flex:1;display:flex;flex-direction:column;gap:1px;min-width:0}
.chap b{font:600 18px/1.15 var(--fd)}
.chap i{font-size:14px;color:var(--paper-dim)}
.chap .st{color:var(--ochre);font-size:14px;letter-spacing:1px;white-space:nowrap}
.chap .st .off{opacity:.3}
.chap.soon{cursor:default}
.chap.soon b,.chap.soon .no{opacity:.45}
.chap.soon .st{font:italic 12px var(--fb);color:var(--paper-dim);letter-spacing:0}
#notes-btn{flex:0 0 auto;height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line);background:transparent;color:var(--paper);font:600 13px var(--fb);cursor:pointer}
#notes-btn:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}
#hud{flex:0 0 auto;max-height:46%;overflow-y:auto;background:var(--cab2);border-top:1px solid var(--line);padding:10px 14px 12px;-webkit-overflow-scrolling:touch}
.hud-goal{display:flex;justify-content:space-between;gap:10px;font-size:14px;line-height:1.3}
.hud-goal b{font-weight:600;white-space:nowrap}
.hud-line{font-size:14px;color:var(--paper-dim);margin-top:6px;line-height:1.4}
.hud-line b{color:var(--paper);font-weight:600}
.hud-row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center}
.hud-row .btn{flex:1;min-height:42px;padding:9px 10px;font-size:14px}
.hud-row .btn.sel{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.big{font:600 22px/1 var(--fd)}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:25;display:none;justify-content:center;pointer-events:none}
#sheet.on{display:flex}
#sheet .sh{pointer-events:auto;width:min(100%,560px);height:72vh;max-height:calc(100% - 60px);background:var(--paper);color:var(--ink);border-radius:14px 14px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.5);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
#sheet .sh-top{display:flex;align-items:center;gap:6px;padding:10px 12px 6px 16px;border-bottom:1px solid rgba(41,33,27,.15)}
#sheet .sh-top h4{font:600 18px/1.1 var(--fd);margin:0;flex:1}
#sheet .sh-top button.x{width:40px;height:40px;border:0;background:transparent;font:400 26px/1 var(--fd);color:var(--ink);cursor:pointer}
#sheet .sh-tabs{display:flex;gap:6px;padding:8px 14px 4px}
#sheet .sh-tabs button{border:1px solid rgba(41,33,27,.25);background:transparent;border-radius:15px;padding:4px 12px;font-size:14px;color:var(--ink2);cursor:pointer;min-height:32px}
#sheet .sh-tabs button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
#sheet .sh-body{flex:1;overflow-y:auto;padding:8px 16px 18px;-webkit-overflow-scrolling:touch;-webkit-user-select:text;user-select:text}
#sheet .sh-body p{font-size:15px;line-height:1.5;margin:0 0 10px}
.srow{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:8px 0;border-bottom:1px solid rgba(41,33,27,.12)}
.srow .l{font-size:14px}
.srow .v{font:500 14px var(--fm);text-align:right;white-space:nowrap}
.srow .m{grid-column:1 / span 2;font-size:13px;color:var(--ink2);line-height:1.35}
.gbox{margin:6px 0 14px}
.gbox h5{font:600 14px/1.2 var(--fd);margin:0 0 2px}
.gbox canvas{width:100%;height:150px;display:block}
.gbox .leg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
.gbox .leg i{display:inline-block;width:12px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:5px}
.card .insight{font-size:16px;line-height:1.5}
.card details{border-top:1px solid rgba(41,33,27,.18);padding:8px 0 2px}
.card summary{font:600 15px/1.3 var(--fd);cursor:pointer;padding:4px 0;list-style-position:outside}
.card details p{font-size:14px;color:var(--ink2);margin-top:6px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:44px;height:44px;border-radius:22px;border:1.5px solid var(--line);background:transparent;color:var(--paper);font:600 22px/1 var(--fd);cursor:pointer}
</style>
</head>
<body>
<div id="app">
 <section id="scr-title" class="screen on">
  <canvas id="title-cv"></canvas>
  <div class="title-wrap">
   <h1>Endless<br>Forms</h1>
   <p class="sub">Small experiments in evolution, from a single gene to the tree of life.</p>
   <button class="btn primary" id="btn-begin">Open the notebook</button>
   <p class="quote">“…endless forms most beautiful and most wonderful have been, and are being, evolved.”<br><span>Charles Darwin, 1859</span></p>
  </div>
 </section>
 <section id="scr-menu" class="screen">
  <header class="menu-head"><h2>Field notebook</h2><p id="menu-stars"></p></header>
  <div class="menu-body" id="menu-body"></div>
  <footer class="tree-foot"><button class="btn ghost" id="btn-title">Title</button><button class="btn ghost" id="btn-snd" aria-pressed="true">Sound on</button></footer>
 </section>
 <section id="scr-play" class="screen">
  <header id="bar">
   <button id="bar-back" class="iconbtn" aria-label="Back to the notebook">‹</button>
   <div id="bar-title"></div>
   <div id="bar-gen" class="mono"></div>
   <button id="notes-btn" aria-label="Open notes: the idea, the numbers and the graphs">Notes</button>
  </header>
  <div id="stage"><canvas id="scene"></canvas></div>
  <div id="hud"></div>
 </section>
</div>
<div id="sheet"><div class="sh" role="dialog" aria-label="Notes"><div class="sh-top"><h4 id="sh-title">Notes</h4><button class="x" id="sh-x" aria-label="Close notes">×</button></div><div class="sh-tabs" id="sh-tabs"><button data-t="idea" class="on">The idea</button><button data-t="num">Numbers</button><button data-t="gra">Graphs</button></div><div class="sh-body" id="sh-body"></div></div></div>
<div id="cards"></div>
<div id="toasts"></div>
<div id="err"></div>
<script>
(function(){
'use strict';
/* ================= CORE ================= */
const TAU = Math.PI * 2;
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
let _s = 1;
function seed(n) { _s = (n >>> 0) || 1; }
function R() { _s |= 0; _s = _s + 0x6D2B79F5 | 0; let t = Math.imul(_s ^ _s >>> 15, 1 | _s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
seed((Date.now() ^ (Math.random() * 1e9)) >>> 0);
function rng(sv) { let s = (sv >>> 0) || 1; return function () { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function gauss() { let u = 0; while (u === 0) u = R(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * R()); }
function poisson(l) { if (l <= 0) return 0; if (l > 30) return Math.max(0, Math.round(l + Math.sqrt(l) * gauss())); const L = Math.exp(-l); let k = 0, p = 1; do { k++; p *= R(); } while (p > L); return k - 1; }
function pick(a) { return a[(R() * a.length) | 0]; }

  lineChart(cv, { theme: 'paper', series: [{ d, c: col || '#2f7f7a', w: 2.5 }], y0: 0, y1: 1, refs: [{ v: goal, label: (below ? 'goal under ' : 'goal ') + pct(goal), c: '#a8263f' }], fy: v => pct(v), x0l: 'gen 1', xl: 'gen ' + (d.length) });
}

/* ---------- Chapter I: crypsis ---------- */

    goal: 'Camouflage reaches 75%: the average moth closely matching the lichen. Three stars by generation 10.',
    real: 'Bond and Kamil (2002) let blue jays hunt digital moths on a screen. The moths the jays missed were bred for the next screen, and the population evolved camouflage — and a spread of different looks, because jays hunt with a search image for whatever is common. Here, you were the jay.'
  },
  traits: [{ k: 'tone', n: 8, m0: 0.30, s0: 0.13, mu: 0.03, msd: 0.05, ve: 0.03 }, { k: 'hue', n: 6, m0: 0.22, s0: 0.13, mu: 0.03, msd: 0.05, ve: 0.03 }, { k: 'mot', n: 4, m0: 0.30, s0: 0.13, mu: 0.03, msd: 0.05, ve: 0.03 }],

  phen(lay, g) { return { tone: Gen.ph(lay, g, 'tone'), hue: Gen.ph(lay, g, 'hue'), mot: Gen.ph(lay, g, 'mot') }; },
  rot() { return (R() - 0.5) * 0.8; },
  sprite(ph, d, sv) { return mothSprite(ph, d, sv); },
  makeBg(w, h, d) { const tx = barkTex(w, h, d, 4242, false); this.target.T = tx.T; this.target.H = tx.H; return { draw: (c, W, H) => c.drawImage(tx.cv, 0, 0, W, H) }; },
  env() { return { T: this.target.T, H: this.target.H }; },
  match(ph) { const T = this.target; const d2 = ((ph.tone - T.T) / 0.5) ** 2 + 0.7 * ((ph.hue - T.H) / 0.7) ** 2 + 0.35 * ((ph.mot - T.M) / 0.7) ** 2; return Math.exp(-1.2 * d2); },
  focus: { get: ph => ph.tone },
  objective(Hn) { const v = mean(Hn.pop.map(x => this.match(x.ph))); return { label: 'Camouflage', value: v, goal: 0.75, done: v >= 0.75, text: 'Moths breed from whoever you miss. Stars at generations 10, 13 and 16.' }; },
  stars(Hn, o) { return !o.done ? 0 : Hn.gen <= 10 ? 3 : Hn.gen <= 13 ? 2 : 1; },
  dawnLine(Hn) { const r = Hn.lastRec; if (!r || r.R == null) return 'Dawn. Find them before the light goes flat.'; return 'The offspring came out ' + Math.abs(r.R).toFixed(2) + (r.R >= 0 ? ' paler' : ' darker') + ' on average than their parents’ generation.'; },
  quickLine(Hn, r) { return 'Offspring ' + Math.abs(r.R).toFixed(2) + (r.R >= 0 ? ' paler' : ' darker') + '. Camouflage <b>' + pct(Hn.obj.value) + '</b>.'; },

      title: 'Generation ' + rec.gen + ': morning over',
      leg: '<div class="leg"><span><i style="background:rgba(41,33,27,.25)"></i>whole population</span><span><i style="background:#a8263f"></i>the ones you ate</span><span><i style="background:#b07a14;height:2px"></i>bark</span></div>',
      hist: { lo: 0, hi: 1, bins: 18, layers: [{ v: rec.vals, c: 'rgba(41,33,27,.25)' }, { v: rec.ev, c: '#a8263f' }], marker: T, l0: 'dark', l1: 'pale' },
      text: rec.eaten ? 'You ate ' + rec.eaten + '. On the dark-to-pale scale they averaged ' + (rec.mEat).toFixed(2) + '; the moths you missed averaged ' + rec.mSurv.toFixed(2) + ', and the bark sits at ' + T.toFixed(2) + '. Only the missed moths breed.' : 'You ate nothing, so every moth breeds and nothing is selected.'
    };

  chartCap: 'Population camouflage by generation.',

    return s;
  }
};

/* ---------- Chapter II: industrial melanism ---------- */
const CH_SOOT = {

    goal: 'First, black moths reach 75%. Then, once the Clean Air Act cleans the trees, bring them back under 40%.',
    real: 'The first black peppered moth was recorded in Manchester in 1848; by 1895 about 98% there were black. Carbonaria turned out to be a jumping gene inserted into the gene cortex, dated to around 1819 (van’t Hof et al. 2016). After clean-air laws the black form declined across Britain, and Majerus’s six-year field experiment confirmed that birds take the conspicuous form (Cook et al. 2012).'

  traits: [{ k: 'carb', n: 1, kind: 'dom', p0: 0.05, mu: 0.01, back: 0 }, { k: 'tone', n: 4, m0: 0.74, s0: 0.04, mu: 0.02, msd: 0.03, ve: 0.02 }, { k: 'hue', n: 4, m0: 0.84, s0: 0.06, mu: 0.02, msd: 0.04, ve: 0.02 }],

  phen(lay, g) { const black = Gen.dom(lay, g, 'carb'); return black ? { black: true, tone: 0.05 + 0.05 * R(), hue: 0.38, mot: 0.12 } : { black: false, tone: Gen.ph(lay, g, 'tone'), hue: Gen.ph(lay, g, 'hue'), mot: 0.78 }; },
  rot() { return (R() - 0.5) * 0.8; },
  sprite(ph, d, sv) { return mothSprite(ph, d, sv); },

  env(Hn) { const s = this.sootAt(Hn); return { soot: s, T: lerp(this.tg.lichen.T, this.tg.soot.T, s), H: lerp(this.tg.lichen.H, this.tg.soot.H, s) }; },

    goal: 'Palewings evolve a 70% resemblance to bitterwings. Three stars by generation 12.',
    real: 'Henry Walter Bates described palatable Amazonian butterflies copying toxic ones in 1862, three years after the Origin. Birds that learn a warning pattern the hard way then spare its look-alikes. The same logic runs in reverse: mimics only work while they are rare, because every harmless copy teaches predators that the warning is a bluff.'
  },
  traits: [{ k: 'red', n: 6, m0: 0.16, s0: 0.16, mu: 0.06, msd: 0.07, ve: 0.03 }, { k: 'dark', n: 6, m0: 0.13, s0: 0.15, mu: 0.06, msd: 0.07, ve: 0.03 }],

      hist: { lo: 0, hi: 1, bins: 16, layers: [{ v: rec.vals, c: 'rgba(41,33,27,.25)' }, { v: rec.ev, c: '#a8263f' }], marker: 1, l0: 'plain cream', l1: 'bitterwing look' },
      text: 'You ate ' + rec.eaten + ' palewings' + (rec.bitter ? ' and ' + rec.bitter + ' bitterwing' + (rec.bitter > 1 ? 's' : '') : '') + '. The ones you ate looked ' + pct(rec.mEat || 0) + ' like bitterwings; the ones you spared, ' + pct(rec.mSurv) + '.'

const HUD = {
  set(html) { $('hud').innerHTML = html; },
  meterHTML(label) { return '<div class="hud-goal"><span id="m-l">' + label + '</span><b id="m-v"></b></div><div class="meter"><i id="m-i"></i><em id="m-e"></em></div>'; },

function introHTML(ch) {
  const i = ch.intro;
  return '<h3>' + ch.title + '</h3><p class="kicker">Chapter ' + ch.num + '. ' + ch.concept + '</p><p>' + (i.hook || i.premise) + '</p><p><b>How to play.</b> ' + (i.how || i.part) + '</p><p class="goal"><b>Goal.</b> ' + i.goal + '</p><p class="basis">Tap Notes during play for the idea, the numbers and the graphs. The game pauses while they’re open.</p>';
}

const End = {
  show(ch, o) {
    if (o.stars) Snd.star(); else Snd.chime();
    if (o.stars) Save.star(ch.id, o.stars);
    const idx = ORDER.indexOf(ch.id); let next = null;
    for (let k = idx + 1; k < ORDER.length; k++) if (REG[ORDER[k]]) { next = REG[ORDER[k]]; break; }
    const btns = [{ t: 'Play again', fn: () => { Cards.close(); App.play(ch); } }, { t: 'Notebook', fn: () => App.exit() }];
    if (next) btns.push({ t: 'Next: ' + next.title, primary: true, fn: () => { Cards.close(); App.open(next); } });
    const sci = (ch.intro && ch.intro.real) || ch.real || '', mth = ch.maths || '';
    Cards.open({
      cls: 'end',
      html: '<h3>' + (o.title || 'Chapter complete') + '</h3><div class="stars">' + starStr(o.stars || 0) + '</div><p class="insight">' + o.insight + '</p>' + (o.chart ? (o.leg || '') + '<canvas></canvas>' + (o.cap ? '<p class="cap">' + o.cap + '</p>' : '') : '') +
        (sci ? '<details><summary>The real thing</summary><p>' + sci + '</p></details>' : '') + (mth ? '<details><summary>The numbers behind it</summary><p>' + mth + '</p></details>' : ''),
      buttons: btns, onOpen: box => { if (o.chart) o.chart(box.querySelector('canvas')); }
    });
  }
};

const Title = {

  build(w, h) {
    const r = rng(1859), segs = [];

      if (tip) return;

      grow(x2, y2, a + (0.2 + r() * 0.4), len * (0.72 + r() * 0.16), depth + 1, t1);
    };

  },
  tick(dt) {

    if (this.key !== w + 'x' + h) this.build(w, h);
    if (this.drawn && this.t > this.end) return;

    for (const s of this.segs) {
      if (this.t < s.t0) continue; const k = clamp((this.t - s.t0) / (s.t1 - s.t0), 0, 1);
      c.strokeStyle = 'rgba(232,223,201,' + (0.28 + 0.3 * (s.w / 2.8)) + ')'; c.lineWidth = s.w;
      c.beginPath(); c.moveTo(s.x, s.y); c.lineTo(lerp(s.x, s.x2, k), lerp(s.y, s.y2, k)); c.stroke();
      if (s.tip && k >= 1) { if (s.dead) { c.strokeStyle = 'rgba(232,223,201,.45)'; c.lineWidth = 1; c.beginPath(); c.moveTo(s.x2 - 3, s.y2); c.lineTo(s.x2 + 3, s.y2); c.stroke(); } else { c.fillStyle = '#cf9a33'; c.beginPath(); c.arc(s.x2, s.y2, 2.2, 0, TAU); c.fill(); } }

  }
};

let lastT = performance.now();
function frame() {
  const now = performance.now(), dt = Math.min(0.05, Math.max(0, (now - lastT) / 1000)); lastT = now; App.t = (App.t || 0) + dt;
  try {
    if (App.scr === 'title') Title.tick(dt);
    else if (App.scr === 'play' && App.mode) { Stage.ctx.setTransform(Stage.dpr, 0, 0, Stage.dpr, 0, 0); if (!(App.paused || Cards.isOpen())) App.mode.update(dt); if (App.mode && !(App.paused || Cards.isOpen())) App.mode.draw(Stage.ctx, Stage.w, Stage.h); }

  real: 'G. H. Hardy and Wilhelm Weinberg derived the rule independently in 1908. Its departures are diagnostic. Self-fertilising plants and inbred animals show too few heterozygotes. So do samples that unknowingly pool two populations with different allele frequencies — the Wahlund effect (1928). Too many heterozygotes among adults, but not among newborns, is the signature of heterozygote advantage: Anthony Allison (1954) showed that in malarial regions of Africa, people carrying one sickle-cell allele survived malaria better than either homozygote.',

  maths: 'In each generation back, a pair of lineages has a 1 in N chance of sharing a parent, so their merging time is roughly exponential with mean N (here N = 20). With n lineages there are n(n − 1)/2 pairs, so merges come fast at first; the last two lineages alone take on average N generations, and the whole sample’s common ancestor is about 2N(1 − 1/n) generations back — for twenty lineages, 38. Most of the depth of a tree is the wait for its final merge.',
  ideas: ['<p>Every individual has one parent in the generation before (think of a mitochondrial or Y-chromosome line). Follow two lineages back: each generation there is a small chance they pick the same parent, and then they are one.</p><p>How long, on average, in a population of twenty?</p>', '<p>Now follow all twenty lineages back. Many pairs merge quickly; then the few remaining lineages take ages to find each other.</p>', '<p>Three populations, three histories. A population that grew recently was tiny in the past, so lineages collapse together far back but stay separate near the present. A bottleneck crushes many lineages together at one moment. A steady population merges them gradually.</p>'],
  start() { this.lv = 0; this.res = []; this.beginLevel(); },
  sim(sizes) { const G = sizes.length - 1, par = []; for (let g = 0; g < G; g++) { const a = []; for (let i = 0; i < sizes[g]; i++) a.push((R() * sizes[g + 1]) | 0); par.push(a); } return { sizes, par }; },

      HUD.set('<div class="hud-goal"><span><b>Level 3: Read the trees</b></span><b></b></div><div class="hud-line">Tap each tree’s label to cycle it: steady size, recent expansion, or past bottleneck.</div><div class="hud-row"><button class="btn primary" id="co-ck">Check</button></div>'); $('co-ck').onclick = () => this.check3(); }

  real: 'Lactase persistence — digesting milk sugar in adulthood — spread in Europeans over the last several thousand years. The LCT region carries one of the strongest sweep signals in the human genome: a long haplotype, carried by most northern Europeans, with little variation (Bersaglieri et al. 2004). In East African pastoralists, different mutations in the same enhancer produce the same trait (Tishkoff et al. 2007), a convergent pattern closer to a soft sweep. Pleuni Pennings and Joachim Hermisson (2006) described soft sweeps, where selection lifts several haplotypes at once because the beneficial allele was already present on different backgrounds or arose more than once — as in insecticide resistance in Drosophila (Schmidt et al. 2010).',
  maths: 'Diversity at distance x from a swept site recovers roughly as 1 − e^(−x/Δ). The width Δ scales with the ratio of the selection coefficient to the recombination rate: strong selection sweeps faster, giving recombination less time to rescue linked variation, so the valley is wider. In a hard sweep, one haplotype carries the allele and dominates near the site. In a soft sweep, several haplotypes do. Without selection, haplotypes are diverse everywhere.',
  ideas: ['<p>The chromosome is divided into forty windows. Sequencing a window tells you its diversity, with some measurement noise. Diversity is normal far from a sweep and drops sharply towards the selected site.</p><p>Seven windows cannot cover the chromosome. Spread them out first, then zoom in.</p>', '<p>Each panel shows sixteen chromosomes from the same region; each column is a variable site, dark for the derived allele. Near a hard sweep almost every chromosome is identical. Near a soft sweep a few different haplotypes share the region. Without selection, no pattern.</p>'],

/* ================= Chapter: Copy and Paste (transposons, gene duplication) ================= */
