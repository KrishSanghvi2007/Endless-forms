STRETCHING FINGERS INTO A WING",heading:"Pteropus — flight on elongated digits",bodyHtml:`A bat’s wing is literally a hand stretched across the sky. Digits II–V elongate dramatically to span the thin skin ${Xt("patagium","patagium")}, while the thumb stays free as a climbing hook. No new bones were invented—natural selection reshaped the existing ${Xt("homology","homologous")} parts.`,promptHint:"Toggle “Soft Tissue” on the plate to see how the wing membrane stretches across fingers II–V."},{id:"whale",shortLabel:"3 Whale",eyebrow:"FLATTENING A HAND INTO A HYDROFOIL",heading:"Tursiops — locked elbow, extra finger bones",bodyHtml:`When ancestors of whales returned to the sea, their upper arm and forearm shrank and flattened into rigid blades. Inside the smooth flipper, all five mammalian digits persist—and digits II &amp; III add extra segments (${Xt("hyperphalangy","hyperphalangy")}) to stiffen the paddle.`,promptHint:"Toggle “Soft Tissue” to see the five-digit mammalian hand hidden inside the streamlined flipper."},{id:"horse",shortLabel:"4 Horse",eyebrow:"RUNNING ON A SINGLE MIDDLE FINGER",heading:"Equus — digit reduction & vestigial splints",bodyHtml:`A horse gallops on the tip of its enlarged middle finger (digit III: the cannon bone and hoof). Digits I and V vanished over 55 million years of equid evolution, while digits II and IV remain tucked against the cannon bone as slender ${Xt("vestigial","vestigial")} “splint bones”.`,promptHint:"Rotate the horse limb in 3D to spot the thin splint bones flanking the central cannon bone."},{id:"deep",shortLabel:"5 Why",eyebrow:"UNDERGRADUATE DEPTH · EVO-DEVO & ANALOGY",heading:"Homology vs. analogy & deep homology",bodyHtml:`Why do such different animals share one blueprint? Because they inherited the same embryonic ${Xt("hox","Hox gene")} limb-patterning circuit (${Xt("deep_homology","deep homology")}) from a shared ${Xt("tetrapod","tetrapod")} ancestor. Yet wings also show ${Xt("analogy","convergent evolution (analogy)")}—switch modes below to compare.`,promptHint:"Compare Bat, Bird, and Insect wings—or switch on embryonic Hox expression zones."},{id:"check",shortLabel:"6 Check",eyebrow:"VISUAL MASTERY CHECK",heading:"Read the bones yourself",bodyHtml:"Put the blueprint to the test on three real evolutionary comparisons—including clicking directly on the 3D specimens on the right page.",promptHint:"Complete all three challenges to stamp Plate 1 in your Atlas progress map."}],teacherGuide:{estimatedMinutes:12,level:"Undergraduate Evolution (Year 1–2) · Also accessible to AP / A-Level",learningObjectives:["Identify the three conserved tetrapod limb segments (stylopod, zeugopod, autopod) across human, bat, cetacean, and equid forelimbs.","Distinguish homology from analogy with hierarchical precision: bat and bird wings are homologous as tetrapod forelimbs, yet analogous as wings.","Explain how conserved HoxA/HoxD regulatory zones and downstream enhancers (Bmp2, Fgf8, Gremlin) generate dramatic adult diversity without inventing new body plans.","Recognise vestigial structures (equine splint bones MC II & IV) and hyperphalangy as historical signatures of descent with modification."],commonMisconceptions:[{misconception:"“Bat wings and bird wings are simply analogous (or simply homologous).”",correction:"Homology is always level-specific. As forelimbs derived from a common amniote ancestor (~315 Ma), they are homologous; as powered wings evolved independently in mammals and theropod dinosaurs, they are analogous."},{misconception:"“Whales evolved flippers because they needed to swim, or horses lost toes because they didn’t use them.”",correction:"Individuals do not remodel their own heritable traits by need or disuse. Variation in limb-bud growth timing and digit patterning was differentially selected across millions of generations."},{misconception:"“Vestigial means completely functionless.”",correction:"Vestigial means reduced and stripped of its ancestral primary function. Equine sp
