 three distinct departures: genome-wide heterozygote deficit from inbreeding (2pq(1 − F)), sampling deficit from pooled demes (Wahlund, 2Var(p)), and adult heterozygote excess from overdominance (q̂ = s₁/(s₁ + s₂)) in warfarin-resistant rats.","Recognise that populations undergoing drift or post-mating migration can still fit Hardy–Weinberg proportions every generation."],commonMisconceptions:[{misconception:"“A dominant allele automatically spreads until 75% of the population shows it.”",correction:"Dominance describes phenotype expression inside heterozygotes, not transmission advantage. With p = 0.30 and random mating, blue stays at 51% forever."},{misconception:"“If χ² < 3.84, the population is in Hardy–Weinberg equilibrium and not evolving.”",correction:"Two separate errors: (1) small samples have low power (~19% at n=40, F=0.20), and (2) drift and selection after birth can move p while newborns still fit HW."},{misconception:"“Inbreeding decreases allele frequency p.”",correction:"Inbreeding changes genotype proportions (converting Aa into AA and aa across all loci) while leaving p completely unchanged."}],discussionPrompts:["In Page 1, half the beetles look blue yet only 30% of gene copies are A. Where are the missing A alleles—or rather, why are there so many hidden a copies?","In Page 5, both inbreeding and the Wahlund effect produce fewer heterozygotes than 2pq. What single field measurement distinguishes them?","A population fits Hardy–Weinberg proportions at a neutral SNP. Name two evolutionary forces that could still be actively changing allele frequencies."],activityTip:"Have students compare North Beach at n ≈ 25 (one quadrat drop) versus n = 300 (full census) in Page 4, then poll the room on how many got a false “fits HW” on their first quadrat."},scienceCard:{coreTakeaway:"Hardy–Weinberg (p² + 2pq + q² = 1) is the null model of diploid population genetics: departures diagnose specific forces or structure, while a fit alone rules out neither drift no ERS INTO A WING",heading:"Pteropus — flight on elongated digits",bodyHtml:`A bat’s wing is literally a hand stretched across the sky. Digits II–V elongate dramatically to span the thin skin ${Yt("patagium","patagium")}, while the thumb stays free as a climbing hook. No new bones were invented—natural selection reshaped the existing ${Yt("homology","homologous")} parts.`,promptHint:"Toggle “Soft Tissue” on the plate to see how the wing membrane stretches across fingers II–V."},{id:"whale",shortLabel:"3 Whale",eyebrow:"FLATTENING A HAND INTO A HYDROFOIL",heading:"Tursiops — locked elbow, extra finger bones",bodyHtml:`When ancestors of whales returned to the sea, their upper arm and forearm shrank and flattened into rigid blades. Inside the smooth flipper, all five mammalian digits persist—and digits II &amp; III add extra segments (${Yt("hyperphalangy","hyperphalangy")}) to stiffen the paddle.`,promptHint:"Toggle “Soft Tissue” to see the five-digit mammalian hand hidden inside the streamlined flipper."},{id:"horse",shortLabel:"4 Horse",eyebrow:"RUNNING ON A SINGLE MIDDLE FINGER",heading:"Equus — digit reduction & vestigial splints",bodyHtml:`A horse gallops on the tip of its enlarged middle finger (digit III: the cannon bone and hoof). Digits I and V vanished over 55 million years of equid evolution, while digits II and IV remain tucked against the cannon bone as slender ${Yt("vestigial","vestigial")} “splint bones”.`,promptHint:"Rotate the horse limb in 3D to spot the thin splint bones flanking the central cannon bone."},{id:"deep",shortLabel:"5 Why",eyebrow:"UNDERGRADUATE DEPTH · EVO-DEVO & ANALOGY",heading:"Homology vs. analogy & deep homology",bodyHtml:`Why do such different animals share one blueprint? Because they inherited the same embryonic ${Yt("hox","Hox gene")} limb-patterning circuit (${Yt("deep_homology","deep homology")}) from a shared ${Yt("tetrapod","tetrapod")} ancestor. Yet wings also show ${Yt("analogy","convergent evolution (analogy)")}—switch modes below to compare.`,promptHint:"Compare Bat, Bird, and Insect wings—or switch on embryonic Hox expression zones."},{id:"check",shortLabel:"6 Check",eyebrow:"VISUAL MASTERY CHECK",heading:"Read the bones yourself",bodyHtml:"Put the blueprint to the test on three real evolutionary comparisons—including clicking directly on the 3D specimens on the right page.",promptHint:"Complete all three challenges to stamp Plate 1 in your Atlas progress map."}],teacherGuide:{estimatedMinutes:12,level:"Undergraduate Evolution (Year 1–2) · Also accessible to AP / A-Level",learningObjectives:["Identify the three conserved tetrapod limb segments (stylopod, zeugopod, autopod) across human, bat, cetacean, and equid forelimbs.","Distinguish homology from analogy with hierarchical precision: bat and bird wings are homologous as tetrapod forelimbs, yet analogous as wings.","Explain how conserved HoxA/HoxD regulatory zones and downstream enhancers (Bmp2, Fgf8, Gremlin) generate dramatic adult diversity without inventing new body plans.","Recognise vestigial structures (equine splint bones MC II & IV) and hyperphalangy as historical signatures of descent with modification."],commonMisconceptions:[{misconception:"“Bat wings and bird wings are simply analogous (or simply homologous).”",correction:"Homology is always level-specific. As forelimbs derived from a common amniote ancestor (~315 Ma), they are homologous; as powered wings evolved independently in mammals and theropod dinosaurs, they are analogous."},{misconception:"“Whales evolved flippers because they needed to swim, or horses lost toes because they didn’t use them.”",correction:"Individuals do not remodel their own heritable traits by need or disuse. Variation in limb-bud growth timing and digit patterning was differentially selected across millions of generations."},{misconception:"“Vestigial means completely functionless.”",correction:"Vestigial means reduced and stripped of its ancestral primary function. Equine splint bones (MC
