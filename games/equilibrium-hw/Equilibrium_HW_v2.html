<head>

<style>

  <div class="row"><button class="btn primary" id="b-begin">Begin</button><button class="btn" id="b-guide2">Guide</button></div>
</div>

<script>

/* ---- genetics: counts are [AA, Aa, aa] ---- */

const frac = c => { const N = (c[0] + c[1] + c[2]) || 1; return c.map(v => v / N); };

const gamete = g => g === 'AA' ? 'A' : g === 'aa' ? 'a' : (R() < 0.5 ? 'A' : 'a');

/* ---- palette ---- */
const Pal = {};
function readPal() { const cs = getComputedStyle(document.documentElement); for (const k of ['ground1', 'ground2', 'ink', 'muted', 'accent', 'A', 'a', 'body', 'plate', 'good']) Pal[k] = cs.getPropertyValue('--' + k).trim() || '#888888'; const th = document.documentElement.dataset.theme; Pal.dark = th === 'dark' || (th !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches); Bg.dirty = true; }
function hexRGB(h) { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(x => x + x).join(''); const n = parseInt(h, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }

function rrect(c, x, y, w, h, r) { r = Math.max(0, Math.min(r, w / 2, h / 2)); c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function plate(c, x, y, w, h, r = 12, a = 0.92) { c.fillStyle = hexA(Pal.plate, a); rrect(c, x, y, w, h, r); c.fill(); c.strokeStyle = hexA(Pal.ink, 0.1); c.lineWidth = 1; c.stroke(); }

/* a top-down beetle wearing its two alleles on its wing cases */
function beetle(c, x, y, s, g, o = {}) {
  const lens = o.lens || Lens.mode, al = o.al || allelesOf(g), cl = lens === 'geno' ? AC(al[0]) : phenCol(g), cr = lens === 'geno' ? AC(al[1]) : phenCol(g);

  c.fillStyle = cl; c.beginPath(); c.moveTo(0, ey - ry); c.ellipse(0, ey, rx, ry, 0, -Math.PI / 2, Math.PI / 2, true); c.closePath(); c.fill();
  c.fillStyle = cr; c.beginPath(); c.moveTo(0, ey - ry); c.ellipse(0, ey, rx, ry, 0, -Math.PI / 2, Math.PI / 2, false); c.closePath(); c.fill();
  c.strokeStyle = hexA('#000000', 0.45); c.lineWidth = Math.max(0.8, s * 0.05); c.beginPath(); c.ellipse(0, ey, rx, ry, 0, 0, TAU); c.stroke(); c.beginPath(); c.moveTo(0, ey - ry); c.lineTo(0, ey + ry); c.stroke();

}
const elytra = (P, s) => [{ x: P.x - s * 0.2, y: P.y + s * 0.14 }, { x: P.x + s * 0.2, y: P.y + s * 0.14 }];

/* ---- layout ---- */
function field(n, Rc, seed = 1, o = {}) {

}
function hitList(pts, x, y, ok) { let bi = -1, bd = 1e9; pts.forEach((p, i) => { if (ok && !ok(i)) return; const d = Math.hypot(p.x - x, p.y - y); if (d < bd) { bd = d; bi = i; } }); return bi >= 0 && bd < Math.max(18, pts[bi].s * 1.1) ? bi : -1; }
function jarSlots(Rc, n) { let r = 10; for (; r > 1.5; r -= 0.5) { const cols = Math.floor((Rc.w - 4) / (2 * r + 1.5)), rows = Math.floor((Rc.h - 4) / (2 * r + 1.5)); if (cols * rows >= n) break; } const cols = Math.max(1, Math.floor((Rc.w - 4) / (2 * r + 1.5))), out = []; for (let k = 0; k < n; k++) out.push({ x: Rc.x + 2 + r + (k % cols) * (2 * r + 1.5), y: Rc.y + Rc.h - 2 - r - ((k / cols) | 0) * (2 * r + 1.5), r }); return out; }

/* the "break into alleles" animation: every wing case flies to its jar */
function makeSplit(pop, pts, jarA, jarB) {

  id: 'l15', title: 'Evolving, or just unbalanced?', sub: 'Disequilibrium is not evolution',
  enter() { this.score = 0; this.ci = -1; this.t = 0; const T = shuffle([['sel', trajSel()], ['drop', trajDrop()], ['both', trajBoth()], ['still', trajStill()]]); this.T = T; this.next1(); },
  next1() { this.ci++; this.t = 0; if (this.ci >= 4) { finishLevel('l15', this.score >= 4 ? 3 : this.score >= 2 ? 2 : 1, '<p>You sorted <b>' + this.score + ' of 4</b> populations.</p><p>Two different questions: <b>Is the population evolving?</b> — are allele frequencies changing (the dot moving sideways)? <b>Is it in Hardy–Weinberg proportions?</b> — is the dot on the curve? Non-random mating can push a population off the curve without any evolution; selection can move it along the curve while it stays in proportion. Departure from Hardy–Weinberg is a clue, not a verdict.</p>'); return; }
    UI.say('<b>Population ' + 'ABCD'[this.ci] + '.</b> Watch its dot over ten generations (dashed trail). Then choose the best description.');
    UI.ctl(UI.choices([['sel', 'Evolving, and in Hardy–Weinberg proportions'], ['drop', 'Not evolving, but out of Hardy–Weinberg proportions'], ['both', 'Evolving, and out of Hardy–Weinberg proportions'], ['still', 'Neither: in equilibrium']], k => { const ans = this.T[this.ci][0], ok = k === ans; if (ok) { this.score++; Snd.good(); } else Snd.bad(); UI.say((ok ? '<b>Right.</b> ' : '<b>Not quite.</b> ') + { sel: 'It moved <b>sideways along the curve</b>: allele frequencies changed, but genotypes stayed in Hardy–Weinberg proportions — selection or migration, for example.', drop: 'It moved <b>straight down</b>: fewer heterozygotes, but p never changed. Non-random mating, not evolution.', both: 'It moved sideways <b>and</b> below the curve: allele frequencies are changing and genotypes are out of proportion — say, selection plus inbreeding.', still: 'It sat on the curve and never moved: Hardy–Weinberg equilibrium.' }[ans]); UI.ctl(UI.row(UI.btn('Next population', () => this.next1(), 'primary'))); }, true));
  },
  update(dt) { this.t += dt; },
  draw(c) { const A = Stage.area(), sz = Math.min(A.w - 80, A.h * 0.78), G = Fin.geo((A.w - sz) / 2, A.y + 36, sz); if (this.ci < 0 || this.ci >= 4) { Fin.draw(c, G); return; } const tr = this.T[this.ci][1], n = Math.min(tr.length, 1 + Math.floor(this.t / 0.35)); Fin.draw(c, G, { trail: tr.slice(0, n), pts: [{ f: tr[n - 1], col: Pal.accent, r: 7, label: 'ABCD'[this.ci] }] }); }
});

/* ================= Level 16: Invisible carriers ================= */
Game.reg({
  id: 'l16', title: 'Invisible carriers', sub: 'Counting what you cannot see',
  enter() { this.score = 0; this.pop = shuffle(countsToList([81, 18, 1])); this.xray = false; this.mode = 'meadow'; this.q = 0.2; Lens.show(false); Lens.set('phen', true); stepper(this); this.next(); },
  steps: [
    function () { quiz(this, 'Blue is dominant, so carriers look blue. In these <b>100 beetles</b>, just <b>1 is yellow</b> (aa). How many blue ones secretly carry a? Step one: yellow beetles are aa, so <span class="fx">q² = 0.01</span>. What is <b>q</b>?', [['01', '0.01'], ['1', '0.1'], ['05', '0.05'], ['5', '0.5']], '1', 'q is the square root of q²: √0.01 = 0.1. So p = 0.9.', () => this.next()); },
    function () { quiz(this, 'With p = 0.9 and q = 0.1, what share of the beetles are carriers (Aa)?', [['18', '18%'], ['9', '9%'], ['81', '81%'], ['1', '1%']], '18', '2pq = 2 × 0.9 × 0.1 = 0.18. Switching to the genotype lens…', () => { this.xray = true; Lens.set('geno', true); Snd.pop(); this.next(); }); },
    function () { UI.say('<b>Eighteen carriers</b> were hiding among the blue beetles — eighteen times as many as the one yellow beetle you could see. That ratio grows as an allele gets rarer. <b>Drag q</b> down and find where carriers outnumber yellow beetles <b>50 to 1</b>.'); this.mode = 'ratio'; this.first = true; this.tries = 0; UI.ctl(UI.slider({ label: 'q', min: 0.005, max: 0.5, step: 0.0025, value: 0.2, fmt: v => v.toFixed(3), oninput: v => { this.q = v; } }), UI.row(UI.btn('Lock it in', () => { const r = 2 * (1 - this.q) / this.q, ok = Math.abs(r - 50) <= 5; if (ok) { if (this.first) this.score++; Snd.good(); UI.toast('At q = ' + this.q.toFixed(3) + ', carriers outnumber yellow beetles <b>' + r.toFixed(0) + ' to 1</b>.'); this.next(); } else { this.first = false; this.tries++; Snd.bad(); if (this.tries >= 3) { this.q = 2 / 52; UI.toast('Here’s the answer: q ≈ 0.038, where 2pq ÷ q² = 2p ÷ q = 50.', 5000); this.next(); return; } UI.toast('That gives ' + r.toFixed(0) + ' to 1. ' + (r > 50 ? 'q is too small.' : 'q is too big.')); } }, 'primary'))); },
    function () { this.mode = 'human'; quiz(this, 'People too. <b>Cystic fibrosis</b> is recessive and affects about <b>1 in 2,500</b> newborns of Northern European ancestry. Roughly how many people are carriers?', [['25', '1 in 25'], ['50', '1 in 50'], ['1250', '1 in 1,250'], ['2500', '1 in 2,500']], '25', 'q² = 1/2,500, so q = 1/50 = 0.02, and 2pq ≈ 0.039: about <b>1 in 25</b>. This assumes Hardy–Weinberg holds; carrier rates differ between populations, but estimates like this are used in genetic counselling.', () => finishLevel('l16', 1 + Math.min(2, this.score - 1 > 0 ? this.score - 1 : 0), '<p><b>Hardy–Weinberg turns what you can see into what you cannot.</b> From recessive phenotypes: <span class="fx">q = √(share that are aa)</span>; carriers are <span class="fx">2pq</span>. The rarer the allele, the more of its copies hide in carriers: at q = 0.01 there are about 200 carriers for every affected individual.</p>')); }
  ],
  draw(c) {
    const A = Stage.area();
    if (this.mode === 'meadow') { const pts = field(100, fieldRect(A, 0.03, 0.9), 71, { max: 15 }); this.pop.forEach((g, i) => beetle(c, pts[i].x, pts[i].y, pts[i].s, g, { rot: pts[i].rot, ring: this.xray && g === 'Aa' ? Pal.accent : null, noLetters: true })); return; }
    if (this.mode === 'ratio' || this.mode === 'human') { const q = this.q, p = 1 - q, het = 2 * p * q, aa = q * q, r = het / aa, nAa = Math.min(200, Math.round(r)); ink(c, 'for every yellow beetle (aa)…', A.w / 2, A.y + 18, 14, Pal.ink, 'center', 700, 'serif'); beetle(c, A.w / 2, A.y + 52, 18, 'aa', { lens: 'geno' }); ink(c, '…there are ' + r.toFixed(0) + ' hidden carriers (Aa)', A.w / 2, A.y + 86, 14, Pal.ink, 'center', 700, 'serif'); const pts = field(nAa, fieldRect(A, 0.24, 0.94), 72, { max: 14 }); for (let i = 0; i < nAa; i++) beetle(c, pts[i].x, pts[i].y, pts[i].s, 'Aa', { lens: 'geno', noLetters: true }); }
  }
});

/* ================= Level 17: Real populations ================= */
const REALDATA = [
  { n: 'Scarlet tiger moths, Cothill Fen near Oxford', note: 'Fisher, Ford and Sheppard’s collections, 1939–1964: the three wing forms are the three genotypes.', labels: ['typica', 'medionigra', 'bimacula'], c: [15784, 1221, 28], fits: true, why: 'χ² is small: these moths fit Hardy–Weinberg proportions. Yet selection against medionigra and non-random mating have both been reported in this colony. A good fit means any forces were too weak to distort the genotype proportions much — not that no forces act.' },
  { n: 'Sickle-cell haemoglobin, West African adults', note: 'A classic survey from the 1950s, reproduced in population-genetics textbooks.', labels: ['AA', 'AS', 'SS'], c: [25374, 5482, 67], fits: false, why: 'Far too many AS adults and far too few SS. Malaria kills more AA children than AS children, and sickle-cell disease kills most SS children before adulthood. These are survivors, sampled after selection: <b>heterozygote advantage</b>.' },
  { n: 'A beetle colony on a tiny island', note: 'A game population: forty years of sibling matings in a colony of a few dozen.', labels: ['AA', 'Aa', 'aa'], c: [41, 18, 41], fits: false, why: 'Far too few heterozygotes for p = 0.5: inbreeding. The dot sits well below the curve.' }
];
Game.reg({
  id: 'l17', title: 'Real populations', sub: 'Testing equilibrium with real data',
  enter() { this.score = 0; this.di = -1; this.shown = false; this.next1(); },
  next1() { this.di++; this.shown = false; if (this.di >= 3) { finishLevel('l17', this.score >= 3 ? 3 : this.score >= 2 ? 2 : 1, '<p>You judged <b>' + this.score + ' of 3</b> populations correctly.</p><p>A <b>χ² test</b> compares observed genotype counts with Hardy–Weinberg expectations: <span class="fx">χ² = Σ (O − E)² ÷ E</span>, with one degree of freedom; above 3.84 is a significant departure. Real departures are clues: excess heterozygotes among sickle-cell adults pointed to malaria; a deficit points to inbreeding or mixed populations. And a fit, like the moths’, does not prove nothing is happening.</p>'); return; }
    const D = REALDATA[this.di]; UI.say('<b>' + D.n + '.</b> ' + D.note + ' Counts: <b>' + D.c.map((v, i) => v.toLocaleString('en-GB') + ' ' + D.labels[i]).join(', ') + '</b>. Do you think it fits Hardy–Weinberg?');
    UI.ctl(UI.row(UI.btn('Work it out', b => { this.shown = true; const K = this.calc(D); UI.say('p = <b>' + fx3(K.p) + '</b>. Hardy–Weinberg expects <b>' + K.E.map(e => Math.round(e).toLocaleString('en-GB')).join('</b>, <b>') + '</b>. <span class="fx">χ² = ' + (K.x2 < 10 ? K.x2.toFixed(2) : K.x2.toFixed(0)) + '</span> (threshold 3.84). Your verdict?'); UI.ctl(UI.choices([['y', 'Fits Hardy–Weinberg'], ['n', 'Departs from it']], k => { const ok = (k === 'y') === D.fits; if (ok) { this.score++; Snd.good(); } else Snd.bad(); UI.say((ok ? '<b>Right.</b> ' : '<b>Not quite.</b> ') + D.why); UI.ctl(UI.row(UI.btn(this.di < 2 ? 'Next population' : 'Finish', () => this.next1(), 'primary'))); })); }, 'primary')));
  },
  calc(D) { const p = pOf(D.c), r = chi2(D.c, p); return { p, E: r.E, x2: r.x2 }; },
  draw(c) {
    if (this.di < 0 || this.di >= 3) return; const D = REALDATA[this.di], A = Stage.area(), K = this.calc(D), port = A.w < A.h * 1.1, sz = port ? Math.min(A.w - 80, A.h * 0.42) : Math.min(A.w * 0.38, A.h * 0.7), G = port ? Fin.geo((A.w - sz) / 2, A.y + A.h * 0.36 + 26, sz) : Fin.geo(A.w * 0.55, A.y + 40, sz), bw = port ? A.w - 60 : A.w * 0.42;
    genoBar(c, 30, A.y + 30, bw, 20, frac(D.c), { title: 'observed', labels: false }); D.labels.forEach((l, i) => ink(c, l + ' ' + pct(frac(D.c)[i], 1), 30 + bw * (i + 0.5) / 3, A.y + 64, 11.5, Pal.ink, 'center', 700));
    if (this.shown) { genoBar(c, 30, A.y + 98, bw, 20, hwExp(K.p), { title: 'Hardy–Weinberg expectation', labels: false }); }
    Fin.draw(c, G, { pts: this.shown ? [{ f: hwExp(K.p), col: Pal.good, r: 5 }, { f: frac(D.c), col: Pal.accent, r: 7 }] : [{ f: frac(D.c), col: Pal.accent, r: 7 }] });
  }
});

/* ================= The case files ================= */
const CASES = [
  { t: 'The quiet meadow', ex: 'counts', d: [36, 48, 16], txt: 'Genotypes of 100 beetles from a large, undisturbed meadow: 36 AA, 48 Aa, 16 aa.', qs: [{ q: 'What is p?', o: [['6', '0.6'], ['36', '0.36'], ['48', '0.48'], ['4', '0.4']], a: '6', why: '(2 × 36 + 48) ÷ 200 = 0.6.' }, { q: 'Is this population in Hardy–Weinberg proportions?', o: [['y', 'Yes'], ['n', 'No']], a: 'y', why: 'p² = 0.36, 2pq = 0.48, q² = 0.16: an exact match.' }] },
  { t: 'The yellow minority', ex: 'phen', d: [91, 9], txt: 'Only phenotypes are known: 91 blue, 9 yellow, out of 100. Blue is dominant. Assume Hardy–Weinberg.', qs: [{ q: 'How many of the 100 are hidden carriers (Aa)?', o: [['42', 'About 42'], ['9', 'About 9'], ['18', 'About 18'], ['49', 'About 49']], a: '42', why: 'q² = 0.09, so q = 0.3, p = 0.7 and 2pq = 0.42.' }] },
  { t: 'The two valleys', ex: 'counts', d: [82, 36, 82], txt: 'A survey pooled beetles from two valleys either side of a ridge: 82 AA, 36 Aa, 82 aa. p = 0.5, so Hardy–Weinberg expects 50, 100, 50.', qs: [{ q: 'What best explains so few heterozygotes?', o: [['w', 'Two separate populations were pooled'], ['s', 'Selection against heterozygotes'], ['m', 'Mutation'], ['h', 'Heterozygote advantage']], a: 'w', why: 'Each valley alone could be in equilibrium (one mostly A, one mostly a); pooled, they show a deficit of heterozygotes — the Wahlund effect.' }] },
  { t: 'The vanishing yellow', ex: 'trace', d: [0.5, 0.53, 0.56, 0.59, 0.62, 0.65, 0.67, 0.7, 0.72, 0.74], txt: 'p rose steadily over ten generations in a large population. Mark–recapture: 70% of blue beetles survive each season, but only 40% of yellow ones. No migrants arrive.', qs: [{ q: 'Which process best explains the change?', o: [['sel', 'Selection'], ['dr', 'Drift'], ['mut', 'Mutation'], ['nr', 'Non-random mating']], a: 'sel', why: 'A steady, directional change with a clear survival difference between phenotypes is selection.' }] },
  { t: 'The castaways', ex: 'trace', d: [0.5, 0.8, 0.7, 0.9, 0.75, 0.85, 1, 1, 1, 1], txt: 'Six beetles rafted to a new island from a mainland with p = 0.5. The island has stayed tiny. No selection has been detected.', qs: [{ q: 'Which process best explains the island’s history?', o: [['dr', 'Founder effect and drift'], ['sel', 'Selection'], ['mig', 'Migration'], ['mut', 'Mutation']], a: 'dr', why: 'A tiny founding sample, erratic swings, and finally the loss of an allele: drift.' }] },
  { t: 'The ferry', ex: 'trace', d: [0.2, 0.26, 0.31, 0.36, 0.4, 0.43, 0.46, 0.49, 0.51, 0.53], txt: 'An island at p = 0.2. Since a ferry service began, about 50 mainland beetles (mainland p = 0.6) arrive in cargo every year.', qs: [{ q: 'Which process best explains the trend?', o: [['mig', 'Migration'], ['sel', 'Selection'], ['dr', 'Drift'], ['nr', 'Non-random mating']], a: 'mig', why: 'p climbs toward the mainland’s 0.6, ever more slowly as the gap closes: gene flow.' }] },
  { t: 'Like with like', ex: 'fin', d: [[0.25, 0.5, 0.25], [0.31, 0.38, 0.31], [0.34, 0.32, 0.34], [0.36, 0.28, 0.36]], txt: 'Over three generations, observers saw beetles pair almost only with partners of their own colour. The dot’s path on the map is shown.', qs: [{ q: 'Which process is at work?', o: [['nr', 'Non-random mating'], ['sel', 'Selection'], ['dr', 'Drift'], ['mig', 'Migration']], a: 'nr', why: 'The dot dropped straight down: fewer heterozygotes, unchanged p.' }, { q: 'Is this population evolving?', o: [['n', 'No: allele frequencies are unchanged'], ['y', 'Yes: genotype frequencies changed']], a: 'n', why: 'Evolution is a change in allele frequencies. Here only the packaging of alleles into genotypes changed.' }] },
  { t: 'The final case', ex: 'trace', d: [0.3, 0.38, 0.36, 0.45, 0.47, 0.44, 0.53, 0.55, 0.6, 0.58], txt: 'A small island colony (about 20 beetles). Yellow beetles survive a little less well than blue. Every year a few blue-rich migrants arrive from a mainland where p = 0.8.', qs: [{ q: 'What best explains the record?', o: [['combo', 'Selection and migration pushing p up, with drift adding noise'], ['dr', 'Drift alone'], ['nr', 'Non-random mating'], ['mut', 'Mutation alone']], a: 'combo', why: 'A steady upward trend has two directional causes here (selection against yellow and blue-rich migrants), while the small size adds random wobbles.' }] }
];
Game.reg({
  id: 'cases', title: 'The case files', sub: 'Eight mystery populations',
  enter() { this.ci = -1; this.qi = 0; this.right = 0; this.total = CASES.reduce((s, C) => s + C.qs.length, 0); this.nextCase(); },
  nextCase() { this.ci++; this.qi = 0; if (this.ci >= CASES.length) { const r = this.right, n = this.total, rank = r === n ? 'Population geneticist' : r >= n - 2 ? 'Field geneticist' : r >= n / 2 ? 'Field assistant' : 'Apprentice'; finishLevel('cases', r >= n - 1 ? 3 : r >= n - 3 ? 2 : 1, '<p><b>' + rank + '.</b> You solved <b>' + r + ' of ' + n + '</b> questions across eight cases.</p><p>The whole game in one line: alleles form a gene pool; random mating draws from it to give p², 2pq and q²; selection, mutation, migration and drift change the allele frequencies, while non-random mating changes only the genotype frequencies. Hardy–Weinberg is the baseline that lets you tell them apart.</p>'); return; } this.ask(); },
  ask() { const C = CASES[this.ci], Q = C.qs[this.qi]; UI.say('<b>Case ' + (this.ci + 1) + ' of ' + CASES.length + ': ' + C.t + '.</b> ' + (this.qi === 0 ? C.txt + ' ' : '') + '<br><b>' + Q.q + '</b>'); UI.ctl(UI.choices(Q.o, k => { const ok = k === Q.a; if (ok) { this.right++; Snd.good(); } else Snd.bad(); UI.say((ok ? '<b>Right.</b> ' : '<b>Not quite.</b> ') + Q.why); UI.ctl(UI.row(UI.btn(this.qi < C.qs.length - 1 ? 'Next question' : 'Next case', () => { this.qi++; if (this.qi < C.qs.length) this.ask(); else this.nextCase(); }, 'primary'))); }, Q.o.some(o => o[1].length > 18))); },
  draw(c) {
    if (this.ci < 0 || this.ci >= CASES.length) return; const C = CASES[this.ci], A = Stage.area(); ink(c, 'Exhibit ' + (this.ci + 1), 24, A.y + 16, 14, Pal.muted, 'left', 700, 'serif');
    if (C.ex === 'counts') { const pop = countsToList(C.d.map(v => Math.round(v / 2))), pts = field(pop.length, fieldRect(A, 0.1, 0.62), 90 + this.ci, { max: 16 }); pop.forEach((g, i) => beetle(c, pts[i].x, pts[i].y, pts[i].s, g, { lens: 'geno', noLetters: true, rot: pts[i].rot })); genoBar(c, 30, A.y + A.h * 0.74, A.w - 60, 20, frac(C.d), { title: 'observed genotypes', exp: hwExp(pOf(C.d)), expLabel: '▼ Hardy–Weinberg expectation' }); }
    if (C.ex === 'phen') { const pop = shuffle(countsToList([49, 42, 9]).slice()), pts = field(100, fieldRect(A, 0.1, 0.9), 93, { max: 15 }); pop.sort().forEach((g, i) => beetle(c, pts[i].x, pts[i].y, pts[i].s, g, { lens: 'phen', rot: pts[i].rot })); }
    if (C.ex === 'trace') lineChart(c, 50, A.y + A.h * 0.14, A.w - 90, A.h * 0.62, [{ d: C.d, col: Pal.A, wd: 3 }], { n: C.d.length, title: 'p by generation', yl: ['0', '1'] });
    if (C.ex === 'fin') { const sz = Math.min(A.w - 80, A.h * 0.75), G = Fin.geo((A.w - sz) / 2, A.y + 40, sz); Fin.draw(c, G, { trail: C.d, pts: [{ f: last(C.d), col: Pal.accent, r: 7 }] }); }
  }
});

/* ================= Guide, settings, boot ================= */
const GUIDE = '<h3>Alleles, genotypes, phenotypes</h3><p>Each beetle carries two alleles of the colour gene: its <b>genotype</b> (AA, Aa or aa). Its colour is its <b>phenotype</b>. A is <b>dominant</b>: Aa looks like AA. Dominance says nothing about how common an allele is.</p>'
  + '<h3>Allele frequencies</h3><p>Break every individual into its two alleles and count: <span class="fx">p = (2 × AA + Aa) ÷ 2N</span>, <span class="fx">q = 1 − p</span>.</p>'
  + '<h3>The equation</h3><p>Random mating draws two alleles from the gene pool, independently. AA needs A twice (<b>p²</b>); aa needs a twice (<b>q²</b>); Aa can form two ways (<b>2pq</b>). <span class="fx">p² + 2pq + q² = (p + q)² = 1</span>.</p>'
  + '<h3>Equilibrium</h3><p>With random mating and nothing else acting, allele frequencies stay constant and genotype frequencies reach p², 2pq, q² after <b>one generation</b>.</p>'
  + '<h3>The triangle map (de Finetti diagram)</h3><p>Each population is a point: left to right is the share of a alleles; height is the share of heterozygotes. The curve is Hardy–Weinberg. <b>Sideways</b> = allele frequencies changing (evolution). <b>Up or down off the curve</b> = genotypes out of proportion.</p>'
  + '<h3>Breaking the assumptions</h3><table><tr><th>Broken</th><th>What happens</th></tr><tr><td>No selection</td><td>Allele frequencies change; rare recessives hide in carriers</td></tr><tr><td>No mutation</td><td>Allele frequencies change, very slowly; the source of new alleles</td></tr><tr><td>No migration</td><td>Allele frequencies move toward the migrants’</td></tr><tr><td>Large population</td><td>Drift: random change, allele loss, bottlenecks, founders</td></tr><tr><td>Random mating</td><td>Genotype frequencies change; allele frequencies do not</td></tr></table>'
  + '<h3>Using it</h3><p>Carriers from recessive phenotypes: <span class="fx">q = √(aa)</span>, carriers = <span class="fx">2pq</span>. Testing equilibrium: <span class="fx">χ² = Σ (O − E)² ÷ E</span>, one degree of freedom, significant above 3.84.</p>';
function openGuide() { UI.card({ title: 'Field guide', html: GUIDE, buttons: [{ t: 'Close', primary: true }] }); }
function applyTheme() { const t = Save.d.theme; if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; readPal(); }
function openSettings() {
  const th = Save.d.theme || '';
  UI.card({ title: 'Settings', html: '<p>Sound: <b>' + (Save.d.mute ? 'off' : 'on') + '</b>. Colours: <b>' + (th || 'match my device') + '</b>. Levels: <b>' + (Save.d.all ? 'all unlocked' : 'unlock in order') + '</b>.</p>', buttons: [
    { t: Save.d.mute ? 'Turn sound on' : 'Turn sound off', fn: () => { Save.d.mute = !Save.d.mute; Save.save(); openSettings(); } },
    { t: 'Colours: ' + (th === '' ? 'dark' : th === 'dark' ? 'light' : 'device'), fn: () => { Save.d.theme = th === '' ? 'dark' : th === 'dark' ? 'light' : ''; Save.save(); applyTheme(); openSettings(); } },
    { t: Save.d.all ? 'Lock levels in order' : 'Unlock all levels', fn: () => { Save.d.all = !Save.d.all; Save.save(); if (Game.id === 'map') Game.go('map'); openSettings(); } },
    { t: 'Reset progress', fn: () => UI.card({ title: 'Reset progress?', html: '<p>This clears every star.</p>', buttons: [{ t: 'Keep my progress' }, { t: 'Reset', primary: true, fn: () => { Save.d.stars = {}; Save.d.done = {}; Save.save(); Game.go('map'); } }] }) },
    { t: 'Done', primary: true }] });
}
function boot() {
  Save.load(); applyTheme(); try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => readPal()); } catch (e) { }
  Stage.init(); Lens.init();
  const missing = ORDER.concat(['title', 'map']).filter(id => !Game.scenes[id]); if (missing.length) showErr('Missing levels: ' + missing.join(', '));
  $('b-map').onclick = () => { Snd.unlock(); Snd.click(); Game.go('map'); }; $('b-guide').onclick = () => { Snd.unlock(); Snd.click(); openGuide(); }; $('b-guide2').onclick = () => { Snd.unlock(); Snd.click(); openGuide(); }; $('b-set').onclick = () => { Snd.unlock(); Snd.click(); openSettings(); }; $('b-begin').onclick = () => { Snd.unlock(); Snd.click(); Game.go('map'); };
  window.HW = { Game, Save, UI, Stage, FX, Pal, Lens, ORDER, LV };
  Game.go('title'); Game.frame();
}
boot();

})();
