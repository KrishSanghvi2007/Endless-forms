<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Equilibrium — a Hardy–Weinberg game</title>
<style>

  --sky1: #b6c2ea; --sky2: #efcfd6; --sky3: #f8e2c4; --hill1: #8fae97; --hill2: #6f9681; --hill3: #557c6b;

  }
}

  --ink: #eef0ff; --muted: #a6abcc; --accent: #ff7d9c; --glow: #ffd36e; --plate: #0b0e26; --panel: rgba(14, 17, 42, .74);

html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }

.sld { display: flex; align-items: center; gap: 10px; width: 100%; margin: 2px 0; }
.sld input { flex: 1; accent-color: var(--accent); height: 28px; }
.sl-l { font-size: 13px; color: var(--muted); min-width: 58px; }
.sl-v { min-width: 70px; text-align: right; font-variant-numeric: tabular-nums; font-size: 15px; }
.al { font-family: var(--serif); font-style: italic; font-weight: 700; }
.al.A { color: var(--red); }

<body>

  <button class="ibtn" id="b-guide">Guide</button>
  <button class="ibtn" id="b-set" aria-label="Settings">⚙︎</button>
</div>
<div id="titlecard">
  <h1>Equilibrium</h1>
  <div class="eq"><span class="tAA">p²</span> + <span class="tAa">2pq</span> + <span class="taa">q²</span> = 1</div>
  <p>A game about the Hardy–Weinberg principle: why genes in a population stay put, and what makes them move.</p>
  <div class="row"><button class="btn primary" id="b-begin">Begin</button><button class="btn" id="b-guide2">Field guide</button></div>
</div>
<div id="panel" class="hide"><div id="say"></div><div id="ctl"></div></div>
<div id="toasts"></div>
<div id="modal"></div>

<script>
(function () {

/* ---- drawing helpers ---- */

/* a snapdragon-like flower; col may be a genotype or a colour */

const bloomY = (p) => p.y - p.s * 1.75;

/* ---- layout ---- */
const Stage = {

  init() { this.cv = $('cv'); this.c = this.cv.getContext('2d'); addEventListener('resize', () => this.resize()); this.resize(); this.bind(); },
  resize() { this.dpr = Math.min(2, window.devicePixelRatio || 1); this.w = window.innerWidth; this.h = window.innerHeight; this.cv.width = Math.round(this.w * this.dpr); this.cv.height = Math.round(this.h * this.dpr); this.cv.style.width = this.w + 'px'; this.cv.style.height = this.h + 'px'; Bg.dirty = true; if (Game.scene && Game.scene.resize) Game.scene.resize(); },
  area() { const tp = $('top'), pn = $('panel'), t = tp.classList.contains('hide') ? 0 : tp.getBoundingClientRect().bottom, b = pn.classList.contains('hide') ? this.h : pn.getBoundingClientRect().top; return { x: 0, y: t + 4, w: this.w, h: Math.max(140, b - t - 10) }; },
  bind() {
    const pos = e => { const r = this.cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
    this.cv.addEventListener('pointerdown', e => { Snd.unlock(); if (UI.modal) return; const [x, y] = pos(e); this.down = { x, y }; const S = Game.scene; if (S && S.down) S.down(x, y); });

function meadow(n, A, seed = 1, o = {}) {

/* ---- background ---- */
const Bg = {
  dirty: true, off: null, stars: [], flies: [],
  build() {
    const w = Stage.w, h = Stage.h; this.off = document.createElement('canvas'); this.off.width = Math.max(1, Math.round(w * Stage.dpr)); this.off.height = Math.max(1, Math.round(h * Stage.dpr)); const c = this.off.getContext('2d'); c.setTransform(Stage.dpr, 0, 0, Stage.dpr, 0, 0);

/* ---- effects ---- */
const FX = {
  ps: [],
  add(p) { this.ps.push(Object.assign({ t: 0, life: 1 }, p)); return p; },
  fly(x0, y0, x1, y1, al, life, done, o = {}) { return this.add(Object.assign({ kind: 'fly', x0, y0, x1, y1, x: x0, y: y0, al, life, done, lift: 30 + R() * 40, delay: 0 }, o)); },
  update(dt) {
    for (const p of this.ps) {
      p.t += dt; const tt = p.t - (p.delay || 0);
      if (p.kind === 'fly') { const k = ease(clamp(tt / p.life, 0, 1)); p.x = lerp(p.x0, p.x1, k) + Math.sin(k * Math.PI) * (p.arc || 0); p.y = lerp(p.y0, p.y1, k) - Math.sin(k * Math.PI) * p.lift; }
      else if (p.vx != null) { p.vy += (p.g || 0) * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot = (p.rot || 0) + (p.vr || 0) * dt; }
      if (tt >= p.life && p.done && !p.fired) { p.fired = true; p.done(p); }
    }
    this.ps = this.ps.filter(p => p.t - (p.delay || 0) < p.life);
  },
  draw(c) {
    for (const p of this.ps) {
      if (p.t < (p.delay || 0)) continue; const k = clamp((p.t - (p.delay || 0)) / p.life, 0, 1), a = p.fade ? 1 - k : 1;
      if (p.kind === 'fly') mote(c, p.x, p.y, p.al, p.r || 3.4, a);
      else if (p.kind === 'conf') { c.save(); c.translate(p.x, p.y); c.rotate(p.rot); c.globalAlpha = a; c.fillStyle = p.col; c.fillRect(-3, -6, 6, 12); c.restore(); }
      else if (p.kind === 'ring') { c.strokeStyle = hexA(p.col, 0.7 * (1 - k)); c.lineWidth = 2.5; c.beginPath(); c.arc(p.x, p.y, 6 + k * (p.rad || 40), 0, TAU); c.stroke(); }
      else if (p.kind === 'text') { c.globalAlpha = 1 - k; ink(c, p.txt, p.x, p.y - k * 30, p.size || 18, p.col || Pal.ink, 'center', 800, 'serif'); c.globalAlpha = 1; }

  clear() { this.ps = []; },
  ring(x, y, col, rad = 40) { this.add({ kind: 'ring', x, y, col: col || Pal.glow, rad, life: 0.6 }); },

};

/* ---- loop ---- */
const Game = {
  scenes: {}, scene: null, id: '', t: 0, last: 0,
  reg(s) { this.scenes[s.id] = s; },
  go(id, arg) {
    if (this.scene && this.scene.exit) this.scene.exit(); UI.close(); UI.clear(); FX.clear();
    const S = this.scenes[id]; this.scene = S; this.id = id;
    $('panel').classList.toggle('hide', !!S.noPanel); $('top').classList.toggle('hide', !!S.noTop); UI.top(S.title || '', S.sub || '');
    S.enter(arg);
  },
  frame() {
    const now = performance.now(), dt = Math.min(0.05, this.last ? (now - this.last) / 1000 : 0.016); this.last = now; this.t += dt;
    const c = Stage.c; c.setTransform(Stage.dpr, 0, 0, Stage.dpr, 0, 0);
    try { Bg.draw(c, Stage.w, Stage.h, this.t); const S = this.scene; if (S) { if (!UI.modal && S.update) S.update(dt); if (S.draw) S.draw(c, Stage.w, Stage.h); } FX.update(dt); FX.draw(c); } catch (e) { showErr(e); }
    setTimeout(() => this.frame(), 16);
  }
};
function showErr(e) { const b = $('err'); if (b && b.style.display !== 'block') { b.style.display = 'block'; b.textContent = 'Something went wrong: ' + ((e && e.stack) || e); } }
window.addEventListener('error', e => showErr(e.error || e.message));

/* ================= Scenes: title, map, stations 1–4 ================= */

  { id: 's4', name: 'One generation', sub: 'Reaching equilibrium', desc: 'A meadow far from equilibrium reaches it in one generation, and then stays put.' },
  { id: 'hub', name: 'Five ways to break it', sub: 'The assumptions', desc: 'Selection, mutation, migration, drift and non-random mating: play each one and see what it does.' },
  { id: 's6', name: 'Hidden carriers', sub: 'Putting it to work', desc: 'Count invisible carriers, then test real data for equilibrium.' },

}

/* ---- title ---- */
Game.reg({

  enter() { $('titlecard').classList.add('on'); this.ring = []; for (let i = 0; i < 72; i++) this.ring.push({ a: R() * TAU, r: 0.75 + R() * 0.5, sp: 0.05 + R() * 0.1, al: R() < 0.62 ? 'A' : 'a', ph: R() * TAU }); },

/* ================= Station 1: Two copies ================= */
Game.reg({
  id: 's1', title: 'Two copies', sub: 'Genotype and phenotype',
  enter() { this.al = ['A', 'a']; this.dom = false; this.mode = 'build'; this.made = new Set(); stepper(this); this.next(); },

    UI.ctl(UI.row(UI.btn(this.di < 2 ? 'Next survey' : 'Finish', () => { this.di++; if (this.di < 3) this.chi(); else finishStation('s6', this.right >= 6 ? 3 : this.right >= 4 ? 2 : 1, '<p>You got <b>' + this.right + ' of 6</b>.</p><p>Hardy–Weinberg turns what you can see into what you cannot: from the share of recessive phenotypes, <span class="fx">q = √(aa)</span>, and carriers are <span class="fx">2pq</span>. And as a <b>null model</b>, it tells you when something interesting is happening: a χ² test of observed against expected genotypes flags inbreeding, selection or mixed populations.</p>'); }, 'primary')));
  },
  draw(c) {
    const A = this.layout();
    if (this.mode === 'meadow') { this.pop.forEach((g, i) => { const P = this.pts[i]; flower(c, P.x, P.y, P.s, g === 'aa' ? 'aa' : 'AA', { glow: this.xray && g === 'Aa' ? 1.2 : 0, glowCol: Pal.glow, ring: this.xray && g === 'Aa' ? Pal.glow : null }); }); ink(c, this.xray ? '18 carriers revealed' : '99 red, 1 white', A.w / 2, A.y + 26, 18, Pal.ink, 'center', 600, 'serif'); return; }
    const D = this.D; if (!D) return; const K = this.calc(D.c), bw = Math.min(300, A.w * 0.7); barsHW(c, A.w / 2 - bw / 2, A.y + A.h * 0.2, bw, A.h * 0.45, frac(D.c), this.shown ? hwExp(K.p) : null, { labels: ['MM', 'MN', 'NN'], title: this.shown ? 'observed (bars) vs Hardy–Weinberg (dashed)' : 'observed genotypes' });
    if (this.shown) ink(c, 'χ² = ' + K.x2.toFixed(K.x2 < 10 ? 2 : 1), A.w / 2, A.y + A.h * 0.2 + A.h * 0.45 + 46, 20, K.x2 > 3.84 ? Pal.accent : Pal.ink, 'center', 600, 'serif');
  }
});

/* ================= The grand quiz ================= */
const QBANK = [
  { q: 'In a population, q = 0.3. What is the frequency of heterozygotes?', o: ['0.42', '0.21', '0.09', '0.49'], why: '2pq = 2 × 0.7 × 0.3 = 0.42.' },
  { q: 'Which of these is <b>not</b> an assumption of Hardy–Weinberg?', o: ['Equal numbers of each genotype', 'No selection', 'Random mating', 'No migration'], why: 'Genotype frequencies are predicted by p and q; nothing requires them to be equal.' },
  { q: '36% of a population are recessive homozygotes (aa). What is q?', o: ['0.6', '0.36', '0.18', '0.4'], why: 'q² = 0.36, so q = √0.36 = 0.6.' },
  { q: 'Which force changes genotype frequencies <b>without</b> changing allele frequencies?', o: ['Non-random mating', 'Genetic drift', 'Selection', 'Migration'], why: 'Non-random mating repackages the same alleles into different genotypes.' },
  { num: true, q: 'p = 0.8. What percentage of the population is homozygous recessive (aa)?', ans: 4, tol: 0.5, min: 0, max: 20, step: 0.5, unit: '%', why: 'q = 0.2, so q² = 0.04: 4%.' },
  { q: 'A population with p = 0.5 has no heterozygotes at all. With random mating, how many generations until it reaches Hardy–Weinberg proportions?', o: ['One', 'Two', 'About ten', 'It never does'], why: 'A single generation of random mating produces p², 2pq and q².' },
  { q: 'Why is the heterozygote term 2pq rather than pq?', o: ['There are two ways to combine one A and one a', 'Heterozygotes carry two alleles', 'Heterozygotes are twice as fit', 'It corrects for dominance'], why: 'A from the egg and a from the sperm, or the other way round: two routes, each with probability pq.' },
  { q: 'A storm strands 12 beetles on a new island; their allele frequencies differ from the mainland’s. What is at work?', o: ['Genetic drift: a founder effect', 'Mutation', 'Selection', 'Non-random mating'], why: 'A small random sample of founders carries a chance set of alleles.' },
  { q: 'Spraying kills susceptible insects while resistant ones breed. Which assumption is broken?', o: ['No selection', 'Random mating', 'No mutation', 'No migration'], why: 'Genotypes differ in survival: that is selection.' },
  { q: 'Every year, pollen blows into a field from a neighbouring variety. Which assumption is broken?', o: ['No migration', 'No mutation', 'Random mating', 'A large population'], why: 'Incoming alleles are gene flow, or migration.' },
  { q: '1 person in 400 has a recessive condition. Roughly what share are carriers?', o: ['About 1 in 10', 'About 1 in 20', 'About 1 in 200', 'About 1 in 400'], why: 'q = √(1/400) = 0.05, so 2pq = 2 × 0.95 × 0.05 ≈ 0.095: about 1 in 10.' },
  { q: 'A χ² test of Hardy–Weinberg gives χ² = 12.4 with one degree of freedom. What do you conclude?', o: ['The population departs from equilibrium', 'The population fits equilibrium', 'The allele frequencies must be 0.5', 'χ² cannot test this'], why: '12.4 is far above the 3.84 threshold for P < 0.05.' },
  { q: 'Real mutation rates are about 1 in 100,000 per generation. Over a few generations, mutation…', o: ['Barely changes allele frequencies', 'Quickly pushes populations out of equilibrium', 'Always increases heterozygotes', 'Removes harmful alleles'], why: 'Its effect on frequencies is tiny over short times; its role is supplying new alleles.' },
  { num: true, q: 'A meadow has 18 AA, 24 Aa and 8 aa flowers. What is p?', ans: 0.6, tol: 0.01, min: 0, max: 1, step: 0.01, unit: '', why: '(2 × 18 + 24) ÷ (2 × 50) = 60 ÷ 100 = 0.6.' },
  { q: 'In which population does drift change allele frequencies fastest?', o: ['10 individuals', '1,000 individuals', '100,000 individuals', 'All the same'], why: 'Sampling error is largest in small populations.' },
  { q: 'Inbreeding makes heterozygotes…', o: ['Rarer than Hardy–Weinberg predicts', 'Commoner than predicted', 'Exactly as predicted', 'Vanish in one generation'], why: 'Relatives share alleles, so their offspring are more often homozygous.' },
  { q: 'Two populations with different allele frequencies are sampled together. Heterozygotes in the pooled sample are…', o: ['Fewer than Hardy–Weinberg expects', 'More than expected', 'As expected', 'Absent'], why: 'Pooling creates a heterozygote deficit: the Wahlund effect.' },
  { q: 'For a gene with two alleles, p + q equals…', o: ['1', '2', 'p²', '0.5'], why: 'Every allele is either A or a, so their frequencies add to 1.' },
  { q: 'With complete dominance, why can’t you count carriers directly?', o: ['They look the same as AA', 'They are infertile', 'They lack the a allele', 'They die young'], why: 'The dominant allele hides the recessive one, so Aa and AA share a phenotype.' },
  { num: true, q: 'q = 0.1. What percentage of individuals are carriers (Aa)?', ans: 18, tol: 1, min: 0, max: 50, step: 1, unit: '%', why: '2pq = 2 × 0.9 × 0.1 = 0.18: 18%.' },
  { q: 'Survivors of selection are 0% AA, 60% Aa and 40% aa. If they mate at random, their seedlings will be…', o: ['In Hardy–Weinberg proportions for the survivors’ p', 'Exactly 0%, 60% and 40% again', 'All heterozygous', 'All aa'], why: 'The survivors have p = 0.3, so random mating gives 9%, 42% and 49%.' },
  { q: 'Which statement about Hardy–Weinberg is true?', o: ['It describes a population on which no evolutionary force acts', 'It proves populations never evolve', 'It applies only to dominant alleles', 'It requires p = q'], why: 'It is a null model: the baseline against which evolution is measured.' },
  { q: 'Who derived the principle, independently, in 1908?', o: ['G. H. Hardy and Wilhelm Weinberg', 'Gregor Mendel', 'Darwin and Wallace', 'R. A. Fisher'], why: 'A Cambridge mathematician and a German physician, months apart.' },
  { num: true, q: 'p = 0.5 and the population is in equilibrium. What percentage are heterozygotes?', ans: 50, tol: 1, min: 0, max: 100, step: 1, unit: '%', why: '2 × 0.5 × 0.5 = 0.5.' }
];
Game.reg({
  id: 'quiz', title: 'The grand quiz', sub: 'Twelve questions against the clock', TL: 20,
  enter() { this.qs = shuffle(QBANK.slice()).slice(0, 12); this.i = 0; this.score = 0; this.streak = 0; this.right = 0; this.miss = []; this.state = 'intro'; this.shown = 0;
    UI.say('Twelve questions, <b>twenty seconds each</b>. Fast answers earn more, and three right in a row multiplies your points.'); UI.ctl(UI.row(UI.btn('Start the quiz', () => this.ask(), 'primary'))); },
  mult() { return this.streak >= 6 ? 2 : this.streak >= 3 ? 1.5 : 1; },
  ask() {
    const Q = this.qs[this.i]; this.Q = Q; this.left = this.TL; this.state = 'ask'; this.locked = false;
    UI.say('<b>Question ' + (this.i + 1) + ' of 12.</b> ' + Q.q);
    if (Q.num) { this.val = (Q.min + Q.max) / 2; const sl = UI.slider({ label: 'answer', min: Q.min, max: Q.max, step: Q.step, value: this.val, fmt: v => (Q.step < 1 ? v.toFixed(Q.step < 0.1 ? 2 : 1) : v) + Q.unit, oninput: v => { this.val = v; } }); UI.ctl(sl, UI.row(UI.btn('Lock it in', () => this.answer(Math.abs(this.val - Q.ans) <= Q.tol + 1e-9), 'primary'))); }
    else { const order = shuffle(Q.o.map((t, k) => [t, k])); UI.ctl(UI.row(...order.map(([t, k]) => { const b = UI.btn(t, () => this.answer(k === 0, b), 'wide'); b.dataset.k = k; return b; }))); }
  },
  answer(ok, b) {
    if (this.state !== 'ask') return; this.state = 'fb'; const Q = this.Q, A = Stage.area();
    $('ctl').querySelectorAll('button').forEach(x => { x.disabled = true; if (x.dataset.k === '0') x.classList.add('good'); }); if (b && !ok) b.classList.add('bad');
    if (ok) { this.streak++; this.right++; const pts = Math.round((100 + 50 * this.left / this.TL) * this.mult()); this.score += pts; Snd.good(); FX.text(A.w / 2, A.y + A.h * 0.42, '+' + pts, Pal.glow, 30); if (this.streak === 3 || this.streak === 6) { FX.confetti(A.w / 2, A.y + A.h * 0.3, 40); Snd.star(); } }
    else { this.streak = 0; Snd.bad(); this.miss.push(Q); FX.text(A.w / 2, A.y + A.h * 0.42, this.left <= 0 ? 'Time' : 'Not quite', Pal.accent, 26); }
    UI.say((ok ? '<b>Right.</b> ' : (Q.num ? '<b>The answer: ' + Q.ans + Q.unit + '.</b> ' : '<b>Not quite.</b> ')) + Q.why);
    UI.ctl(UI.row(UI.btn(this.i < 11 ? 'Next question' : 'See your result', () => this.nextQ(), 'primary')));
  },
  nextQ() { if (this.state !== 'fb') return; this.i++; if (this.i < 12) this.ask(); else this.end(); },
  update(dt) { if (this.state !== 'ask') return; this.left -= dt; if (this.left <= 0) { this.left = 0; this.answer(false); } },
  end() {
    this.state = 'end'; const n = this.right, rank = n === 12 ? 'Hardy and Weinberg would be proud' : n >= 10 ? 'Population geneticist' : n >= 8 ? 'Pollen counter' : n >= 5 ? 'Gardener' : 'Seedling', best = Math.max(Save.d.best || 0, this.score), isBest = this.score >= best && this.score > 0;
    Save.d.best = best; Save.star('quiz', n >= 11 ? 3 : n >= 8 ? 2 : 1); Snd.star(); FX.confetti(Stage.w / 2, Stage.h * 0.35, 70);
    UI.say('Quiz complete: <b>' + n + ' of 12</b>, <b>' + this.score.toLocaleString('en-GB') + '</b> points.'); UI.ctl(UI.row(UI.btn('Play again', () => Game.go('quiz'), 'primary'), UI.btn('Back to the meadow', () => Game.go('map'))));
    UI.card({ title: rank, html: '<div class="stars">' + starStr(n >= 11 ? 3 : n >= 8 ? 2 : 1) + '</div><p><b>' + n + ' of 12</b> correct, <b>' + this.score.toLocaleString('en-GB') + '</b> points' + (isBest ? ' — a new best.' : '. Your best: ' + best.toLocaleString('en-GB') + '.') + '</p>' + (this.miss.length ? '<h3>Worth another look</h3><ul>' + this.miss.map(Q => '<li>' + Q.q.replace(/<[^>]+>/g, '') + ' <i>' + Q.why + '</i></li>').join('') + '</ul>' : '<p>A perfect round.</p>'), buttons: [{ t: 'Back to the meadow', fn: () => Game.go('map') }, { t: 'Play again', primary: true, fn: () => Game.go('quiz') }] });
  },
  draw(c) {
    const A = Stage.area(), t = Game.t, cx = A.w / 2, cy = A.y + A.h * 0.42, r = Math.min(A.w, A.h) * 0.3;
    const g = c.createRadialGradient(cx, cy, 10, cx, cy, r * 1.6); g.addColorStop(0, hexA(Pal.glow, Pal.night ? 0.16 : 0.22)); g.addColorStop(1, hexA(Pal.glow, 0)); c.fillStyle = g; c.fillRect(0, A.y, A.w, A.h);
    const nm = 18 + this.streak * 6; c.save(); if (Pal.night) c.globalCompositeOperation = 'lighter'; for (let k = 0; k < nm; k++) { const a = t * (0.25 + this.streak * 0.04) + k * TAU / nm; mote(c, cx + Math.cos(a) * r, cy + Math.sin(a) * r * 0.55, k % 3 ? 'A' : 'a', 2.8, 0.85); } c.restore();
    if (this.state === 'ask' || this.state === 'fb') { const k = clamp(this.left / this.TL, 0, 1); c.strokeStyle = hexA(Pal.ink, 0.15); c.lineWidth = 7; c.beginPath(); c.arc(cx, cy, 42, 0, TAU); c.stroke(); c.strokeStyle = k > 0.3 ? Pal.glow : Pal.accent; c.beginPath(); c.arc(cx, cy, 42, -Math.PI / 2, -Math.PI / 2 + TAU * k); c.stroke(); ink(c, Math.ceil(this.left) + '', cx, cy + 1, 26, Pal.ink, 'center', 600, 'serif'); }
    ink(c, this.score.toLocaleString('en-GB'), A.x + 22, A.y + 22, 24, Pal.ink, 'left', 600, 'serif'); ink(c, 'points', A.x + 22, A.y + 44, 11.5, Pal.muted, 'left', 600);
    if (this.mult() > 1) ink(c, '×' + this.mult() + ' streak', A.w - 22, A.y + 22, 18, Pal.accent, 'right', 700, 'serif');
    if (this.state !== 'intro') ink(c, (this.i + 1 > 12 ? 12 : this.i + 1) + ' / 12', A.w - 22, A.y + 46, 12, Pal.muted, 'right', 600);
  }
});

/* ================= Field guide and settings ================= */
const GUIDE = '<h3>Alleles, genotypes, phenotypes</h3><p>Each individual carries two copies (<b>alleles</b>) of a gene, one from each parent. The pair is the <b>genotype</b> (AA, Aa or aa); what you see is the <b>phenotype</b>. A <b>dominant</b> allele hides a recessive one in the heterozygote; with <b>incomplete dominance</b> the heterozygote is in between.</p>'
  + '<h3>Allele frequencies</h3><p><span class="fx">p = (2 × AA + Aa) ÷ 2N</span> is the share of all alleles that are A; <span class="fx">q = 1 − p</span>.</p>'
  + '<h3>The equation</h3><p>If alleles combine at random, a new individual is AA with probability p², Aa with 2pq (two ways to make it) and aa with q²: <span class="fx">p² + 2pq + q² = (p + q)² = 1</span>.</p>'
  + '<h3>Equilibrium</h3><p>With random mating and nothing else going on, allele frequencies stay constant and genotype frequencies reach p², 2pq, q² after <b>one generation</b>.</p>'
  + '<h3>The five assumptions</h3><table><tr><th>Assumption</th><th>If broken</th></tr><tr><td>No selection</td><td>Allele frequencies change; survivors depart from equilibrium</td></tr><tr><td>No mutation</td><td>Allele frequencies change, very slowly</td></tr><tr><td>No migration</td><td>Allele frequencies move toward the migrants’</td></tr><tr><td>Very large population</td><td>Allele frequencies drift at random; alleles can be lost</td></tr><tr><td>Random mating</td><td>Genotype frequencies change; allele frequencies do not</td></tr></table>'
  + '<h3>Using it</h3><p>From recessive phenotypes: <span class="fx">q = √(aa frequency)</span>, carriers = <span class="fx">2pq</span>. To test for equilibrium, compare observed and expected genotype counts: <span class="fx">χ² = Σ (O − E)² ÷ E</span>, with 1 degree of freedom for two alleles; above 3.84 is a significant departure.</p>';
function openGuide() { UI.card({ title: 'Field guide', html: GUIDE, buttons: [{ t: 'Close', primary: true }] }); }
function openSettings() {
  const th = Save.d.theme || '';
  UI.card({ title: 'Settings', html: '<p>Sound is <b>' + (Save.d.mute ? 'off' : 'on') + '</b>. Colours: <b>' + (th ? th : 'match my device') + '</b>. Stations: <b>' + (Save.d.all ? 'all unlocked' : 'unlock in order') + '</b>.</p>', buttons: [
    { t: Save.d.mute ? 'Turn sound on' : 'Turn sound off', fn: () => { Save.d.mute = !Save.d.mute; Save.save(); openSettings(); } },
    { t: 'Colours: ' + (th === '' ? 'night' : th === 'dark' ? 'day' : 'device'), fn: () => { Save.d.theme = th === '' ? 'dark' : th === 'dark' ? 'light' : ''; Save.save(); applyTheme(); openSettings(); } },
    { t: Save.d.all ? 'Lock stations in order' : 'Unlock all stations', fn: () => { Save.d.all = !Save.d.all; Save.save(); if (Game.id === 'map') Game.go('map'); openSettings(); } },
    { t: 'Reset progress', fn: () => UI.card({ title: 'Reset progress?', html: '<p>This clears every star and your best quiz score.</p>', buttons: [{ t: 'Keep my progress' }, { t: 'Reset', primary: true, fn: () => { Save.d.stars = {}; Save.d.done = {}; Save.d.best = 0; Save.save(); Game.go('map'); } }] }) },
    { t: 'Done', primary: true }] });
}
function applyTheme() { const t = Save.d.theme; if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; readPal(); }

/* ================= Boot ================= */
function boot() {
  Save.load(); applyTheme();
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => readPal()); } catch (e) { }
  Stage.init();
  const missing = STATIONS.map(s => s.id).concat(FORCES.map(f => f.id), ['title', 'map']).filter(id => !Game.scenes[id]); if (missing.length) showErr('Missing scenes: ' + missing.join(', '));
  $('b-map').onclick = () => { Snd.unlock(); Snd.click(); Game.go(Game.id.startsWith('f_') ? 'hub' : 'map'); };
  $('b-guide').onclick = () => { Snd.unlock(); Snd.click(); openGuide(); }; $('b-guide2').onclick = () => { Snd.unlock(); Snd.click(); openGuide(); };
  $('b-set').onclick = () => { Snd.unlock(); Snd.click(); openSettings(); };
  $('b-begin').onclick = () => { Snd.unlock(); Snd.chord(); Game.go('map'); };
  window.HW = { Game, Save, UI, Stage, FX, Pal, STATIONS, FORCES, QBANK };
  Game.go('title'); Game.frame();
}
boot();

})();
