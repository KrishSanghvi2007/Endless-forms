<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Equilibrium — a Hardy–Weinberg game</title>
<style>
:root {
  --ground1: #ece6d6; --ground2: #e0d8c3; --ink: #1f2328; --muted: #5a5f68; --accent: #c0265b; --A: #2f5fd0; --a: #e8b416; --body: #2c2824;
  --plate: #fbf8f1; --a-ink: #8f6800; --panel: rgba(251, 248, 241, .94); --line: rgba(31, 35, 40, .15); --btn: #1f2328; --btn-ink: #fbf8f1; --good: #1e7a4f;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ground1: #191b20; --ground2: #15171b; --ink: #eceef2; --muted: #a3a8b4; --accent: #ff6b98; --A: #5b8cff; --a: #f2c94c; --body: #3b3732; --plate: #22252b; --a-ink: #f2c94c; --panel: rgba(30, 33, 39, .95); --line: rgba(236, 238, 242, .15); --btn: #eceef2; --btn-ink: #16181c; --good: #4cc38a; } }
:root[data-theme="dark"] { --a-ink: #f2c94c; --ground1: #191b20; --ground2: #15171b; --ink: #eceef2; --muted: #a3a8b4; --accent: #ff6b98; --A: #5b8cff; --a: #f2c94c; --body: #3b3732; --plate: #22252b; --panel: rgba(30, 33, 39, .95); --line: rgba(236, 238, 242, .15); --btn: #eceef2; --btn-ink: #16181c; --good: #4cc38a; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
body { margin: 0; height: 100%; overflow: hidden; background: var(--ground1); color: var(--ink); font-family: var(--sans); -webkit-tap-highlight-color: transparent; }
#cv { position: fixed; inset: 0; display: block; touch-action: none; }
#top { position: fixed; left: 0; right: 0; top: 0; padding: calc(env(safe-area-inset-top, 0px) + 8px) 12px 6px; display: flex; align-items: center; gap: 8px; z-index: 5; background: linear-gradient(var(--ground1), rgba(0,0,0,0)); }
#top.hide { display: none; }
.st { flex: 1; min-width: 0; }
#st-name { font-family: var(--serif); font-size: 19px; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#st-sub { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ibtn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px; height: 36px; min-width: 36px; padding: 0 12px; font: 600 13px var(--sans); cursor: pointer; }
#lens { position: fixed; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 54px); z-index: 5; display: none; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; }
#lens.on { display: flex; }
#lens button { border: 0; background: transparent; color: var(--ink); font: 600 13px var(--sans); padding: 7px 14px; border-radius: 999px; cursor: pointer; }
#lens button.sel { background: var(--btn); color: var(--btn-ink); }
#panel { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); width: min(700px, calc(100% - 20px)); max-height: 46vh; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 14px 16px 12px; z-index: 5; box-shadow: 0 8px 30px rgba(0, 0, 0, .12); }
#panel.hide { display: none; }
#say { font-size: 15.5px; line-height: 1.5; }
#say:empty { display: none; }
#ctl:not(:empty) { margin-top: 8px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.btn { appearance: none; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 999px; padding: 10px 16px; font: 600 14.5px var(--sans); cursor: pointer; min-height: 42px; }
.btn.primary { background: var(--btn); color: var(--btn-ink); border-color: transparent; }
.btn.sel { box-shadow: inset 0 0 0 2px var(--accent); }
.btn.good { background: var(--good); color: #fff; border-color: transparent; }
.btn.bad { background: var(--accent); color: #fff; border-color: transparent; }
.btn:disabled { opacity: .4; cursor: default; }
.btn:focus-visible, .ibtn:focus-visible, input:focus-visible, #lens button:focus-visible, .lv:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.wide { flex: 1 1 100%; text-align: left; }
.sld { display: flex; align-items: center; gap: 10px; width: 100%; margin: 2px 0; }
.sld input { flex: 1; accent-color: var(--accent); height: 28px; }
.sl-l { font-size: 13px; color: var(--muted); min-width: 56px; }
.sl-v { min-width: 74px; text-align: right; font-variant-numeric: tabular-nums; font-size: 15px; }
.A { color: var(--A); font-weight: 800; font-family: var(--serif); }
.a { color: var(--a-ink); font-weight: 800; font-family: var(--serif); font-style: italic; }
.fx { font-family: var(--serif); font-size: 1.07em; white-space: nowrap; }
.sw { display: flex; flex-wrap: wrap; gap: 6px; }
.sw button { border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 10px; padding: 7px 10px; font: 600 13px var(--sans); cursor: pointer; }
.sw button.on { background: var(--good); color: #fff; border-color: transparent; }
.sw button.off { background: var(--accent); color: #fff; border-color: transparent; }
#modal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 10; background: rgba(10, 12, 16, .35); padding: calc(env(safe-area-inset-top, 0px) + 16px) 14px calc(env(safe-area-inset-bottom, 0px) + 16px); }
#modal.on { display: flex; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; max-width: 560px; width: 100%; max-height: 100%; overflow: auto; padding: 20px 20px 14px; color: var(--ink); box-shadow: 0 20px 60px rgba(0, 0, 0, .25); }
.card h2 { font-family: var(--serif); font-weight: 600; font-size: 25px; margin: 0 0 6px; line-height: 1.15; }
.card h3 { font-family: var(--serif); font-weight: 600; font-size: 18px; margin: 14px 0 2px; }
.card p, .card li { line-height: 1.55; margin: 8px 0; font-size: 15px; }
.card ul { padding-left: 20px; margin: 6px 0; }
.card-btns { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; margin-top: 14px; }
.card table { border-collapse: collapse; width: 100%; font-size: 14px; margin: 8px 0; }
.card td, .card th { padding: 6px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.stars { font-size: 28px; color: #d4a017; letter-spacing: 4px; }
.stars .off { opacity: .22; }
.big-eq { font-family: var(--serif); font-size: 26px; text-align: center; margin: 12px 0; }
.mini { display: flex; gap: 12px; align-items: flex-end; height: 88px; padding: 18px 4px 0; }
.mini span { flex: 1; border-radius: 5px 5px 2px 2px; position: relative; border: 1px solid var(--line); }
.mini span i { position: absolute; top: -18px; left: 0; right: 0; text-align: center; font-style: normal; font-size: 12px; color: var(--ink); }
.optc { border: 1px solid var(--line); border-radius: 14px; padding: 6px 10px 6px; cursor: pointer; background: transparent; color: var(--ink); width: calc(50% - 6px); }
.optgrid { display: flex; flex-wrap: wrap; gap: 12px; }
#levels { position: fixed; inset: 0; z-index: 4; overflow: auto; display: none; padding: calc(env(safe-area-inset-top, 0px) + 60px) 14px calc(env(safe-area-inset-bottom, 0px) + 24px); }
#levels.on { display: block; }
#levels .wrap { max-width: 640px; margin: 0 auto; }
#levels h2 { font-family: var(--serif); font-weight: 600; font-size: 21px; margin: 22px 0 6px; }
#levels .chp { color: var(--muted); font-size: 14px; margin: 0 0 8px; line-height: 1.45; }
.lv { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 14px; padding: 10px 12px; margin: 6px 0; cursor: pointer; font: inherit; }
.lv .n { font-family: var(--serif); font-size: 20px; width: 30px; text-align: center; color: var(--muted); }
.lv .t { flex: 1; } .lv .t b { display: block; font-family: var(--serif); font-size: 16.5px; font-weight: 600; } .lv .t span { font-size: 13px; color: var(--muted); }
.lv .s { color: #d4a017; font-size: 15px; letter-spacing: 1px; white-space: nowrap; }
.lv.locked { opacity: .45; }
#titlecard { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: flex-start; text-align: center; z-index: 4; padding: calc(env(safe-area-inset-top, 0px) + 9vh) 24px 24px; pointer-events: none; }
#titlecard.on { display: flex; }
#titlecard > * { pointer-events: auto; }
#titlecard h1 { font-family: var(--serif); font-weight: 500; font-size: clamp(46px, 11vw, 90px); margin: 0; line-height: 1; }
#titlecard p { color: var(--muted); max-width: 30em; margin: 10px auto 0; font-size: 16px; line-height: 1.5; }
#titlecard .row { justify-content: center; position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 7vh); }
#toasts { position: fixed; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 96px); width: min(560px, calc(100% - 24px)); z-index: 8; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
.toast { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; font-size: 14px; line-height: 1.45; transition: opacity .4s; }
.toast.out { opacity: 0; }
#err { display: none; position: fixed; left: 8px; right: 8px; bottom: 8px; z-index: 99; background: #3b0a12; color: #ffd7dd; font: 12px monospace; padding: 10px; border-radius: 8px; white-space: pre-wrap; max-height: 40vh; overflow: auto; }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="top" class="hide">
  <button class="ibtn" id="b-map">Levels</button>
  <div class="st"><div id="st-name"></div><div id="st-sub"></div></div>
  <button class="ibtn" id="b-guide">Guide</button>
  <button class="ibtn" id="b-set" aria-label="Settings">⚙︎</button>
</div>
<div id="lens" role="group" aria-label="Lens"><button data-l="phen">Phenotype</button><button data-l="geno">Genotype</button></div>
<div id="titlecard">
  <h1>Equilibrium</h1>
  <p>A game about the Hardy–Weinberg principle. Each beetle wears its genes on its wings.</p>
  <div class="row"><button class="btn primary" id="b-begin">Begin</button><button class="btn" id="b-guide2">Guide</button></div>
</div>
<div id="levels"><div class="wrap" id="lv-body"></div></div>
<div id="panel" class="hide"><div id="say"></div><div id="ctl"></div></div>
<div id="toasts"></div>
<div id="modal"></div>
<div id="err"></div>
<script>
/*__JS__*/
</script>
</body>
</html>
